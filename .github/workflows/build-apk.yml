name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (Build Tools 33.0.2)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova CLI
        run: npm install -g cordova

      # 100% सेफ डमी लोगो जेनरेटर (Base64) 
      - name: Create Temp App Icon (Fix for missing icon)
        run: |
          if [ ! -f "res/icon.png" ]; then
            mkdir -p res
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > res/icon.png
            echo "Dummy transparent icon created successfully!"
          fi

      - name: Install Dependencies & Add Android Platform
        run: |
          npm install
          cordova platform add android@12.0.1

      - name: Build Android APK (Debug Mode)
        run: cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DISCOM-Survey-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

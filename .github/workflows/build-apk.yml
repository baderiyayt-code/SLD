name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Compatible Gradle (8.2.1)
        run: |
          sudo rm -rf /usr/share/gradle*
          wget -q https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          sudo unzip -q -d /opt gradle-8.2.1-bin.zip
          echo "/opt/gradle-8.2.1/bin" >> $GITHUB_PATH

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build Android APK
        run: |
          npm install
          cordova platform rm android || true
          cordova platform add android@12.0.1
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DISCOM-Survey-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install

      - name: Add Android Platform
        run: |
          cordova platform rm android || true
          cordova platform add android@12.0.1
          cordova prepare android

      - name: Build Android Debug APK
        run: cordova build android --debug --verbose

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DISCOM-Survey-App-Debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

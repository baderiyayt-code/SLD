<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a8a">
    <title>DISCOM Survey Pro</title>

    <script src="cordova.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Leaflet & Plugins -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.js"></script>
    
    <!-- Utilities -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

        :root {
            --bg-base: #f8fafc; --bg-glass: rgba(255, 255, 255, 0.92); --bg-sheet: #ffffff;
            --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.3);
            --text-main: #0f172a; --text-sub: #64748b; --border: rgba(15, 23, 42, 0.1);
            --radius-lg: 16px; --radius-md: 10px;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.06); --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
            --c-11kv: #2563eb; --c-lt: #10b981; --c-dt: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-base); color: var(--text-main); }
        #app-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }

        /* ====== SPLASH SCREEN ====== */
        #splash-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #1e3a8a, #2563eb); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: opacity 0.6s ease, transform 0.6s ease; }
        #splash-screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
        .splash-logo { width: 100px; height: 100px; background: white; color: #2563eb; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: pulse 2s infinite; }
        .splash-title { font-size: 2.2rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 6px; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .splash-subtitle { font-size: 1rem; color: #93c5fd; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        .splash-loader { margin-top: 40px; width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(255,255,255,0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ====== TOP HEADER & DASHBOARD ====== */
        #top-bar { position: absolute; top: env(safe-area-inset-top, 10px); left: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .header-glass { display: flex; justify-content: space-between; align-items: center; background: var(--bg-glass); backdrop-filter: blur(16px); padding: 10px 12px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); pointer-events: auto; }
        .header-title-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .modern-select { appearance: none; background: #f1f5f9; color: var(--text-main); border: 1px solid transparent; padding: 8px 30px 8px 12px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 700; outline: none; cursor: pointer; max-width: 140px; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 8px center; background-size: 14px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;}
        .header-actions { display: flex; gap: 6px; }
        .action-btn-sm { width: 38px; height: 38px; border-radius: var(--radius-md); background: transparent; color: var(--accent); border: none; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; pointer-events: auto; }
        .action-btn-sm.bg { background: #f1f5f9; color: var(--text-main); font-size: 1rem; }

        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; pointer-events: auto; }
        .kpi-tile { background: var(--bg-glass); backdrop-filter: blur(12px); padding: 8px 4px; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 3px solid transparent;}
        .kpi-tile:nth-child(1) { border-top-color: var(--c-11kv); } .kpi-tile:nth-child(2) { border-top-color: var(--c-dt); } .kpi-tile:nth-child(3) { border-top-color: var(--c-lt); } .kpi-tile:nth-child(4) { border-top-color: #8b5cf6; }
        .kpi-label { font-size: 0.6rem; color: var(--text-sub); font-weight: 700; }
        .kpi-val { font-size: 0.95rem; font-weight: 800; margin-top: 2px; }

        /* ====== MAP & CROSSHAIR ====== */
        #map { flex: 1; width: 100%; height: 100%; z-index: 1; background: #e2e8f0; }
        #center-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ef4444; font-size: 32px; font-weight: 900; pointer-events: none; z-index: 999; text-shadow: 0 0 6px #ffffff; }
        #reticle-coordinates { position: absolute; bottom: calc(105px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: #1e293b; color: #ffffff; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; box-shadow: var(--shadow-sm); pointer-events: none; z-index: 999; }
        #layer-indicator { position: absolute; top: calc(75px + env(safe-area-inset-top, 10px)); left: 50%; transform: translateX(-50%); background: var(--bg-glass); color: var(--text-main); padding: 4px 12px; border-radius: 12px; font-size: 0.7rem; font-weight: 800; box-shadow: var(--shadow-sm); z-index: 999; border: 1px solid var(--border); pointer-events:none;}

        /* ====== FLOATING TOOLS ====== */
        .right-tools-stack { position: absolute; right: 12px; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .round-tool-btn { width: 44px; height: 44px; background: var(--bg-sheet); color: var(--text-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border); cursor: pointer; }
        .undo-btn { background: #f59e0b; color: white; border-color: #f59e0b; }

        /* ====== SPEED DIAL ====== */
        #bottom-single-action { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 1002; }
        .center-plus-fab { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: white; border: 3px solid var(--bg-sheet); box-shadow: 0 8px 25px var(--accent-glow); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s; }
        .center-plus-fab.open { transform: rotate(45deg); background: #ef4444; box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3); }

        #speed-dial-menu { position: absolute; bottom: calc(95px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) scale(0.9); width: calc(100% - 24px); max-width: 450px; background: var(--bg-glass); backdrop-filter: blur(20px); border-radius: var(--radius-lg); padding: 14px; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 1001; }
        #speed-dial-menu.active { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }
        .dial-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .dial-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; box-shadow: var(--shadow-sm); }
        .dial-card i { font-size: 1.3rem; }
        .dial-card span { font-size: 0.60rem; font-weight: 700; color: var(--text-main); text-align: center;}

        /* ====== TOAST ====== */
        #app-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: #ffffff; padding: 12px 20px; border-radius: 12px; font-size: 0.9rem; font-weight: 600; box-shadow: var(--shadow-md); z-index: 5000; opacity: 0; transition: all 0.3s; display: flex; align-items: center; gap: 10px; width: max-content; max-width: 90%; }
        #app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ====== ICONS & Z-INDEX LOGIC ====== */
        .gss-square-icon { background: #b91c1c; color: white; border: 2px solid white; border-radius: 8px; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; box-shadow: 0 4px 12px rgba(185, 28, 28, 0.4); z-index: 400 !important;}
        .gss-mini-dot { background: #b91c1c; border-radius: 50%; border: 2px solid white; width: 16px; height: 16px; z-index: 400 !important; }

        .pole-marker-icon { background: #fde047; color: #0f172a; border: 2.5px solid #0f172a; border-radius: 50%; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); width: 26px; height: 26px; z-index: 500 !important;}
        .pole-marker-icon.orphan-pulse { background: #ef4444 !important; color: white !important; border-color: white !important; animation: redGlow 1s infinite !important; }
        
        .dt-square-icon { background: #f59e0b; color: white; border: 1.5px solid white; border-radius: 6px; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; box-shadow: 0 3px 8px rgba(245, 158, 11, 0.4); z-index: 600 !important;}
        
        .lt-pole-icon { background: #10b981; color: white; border: 2px solid white; border-radius: 50%; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.5); width: 22px; height: 22px; z-index: 700 !important;}
        
        .consumer-marker-icon { background: #3b82f6; color: white; border: 1.5px solid white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 9px; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.5); z-index: 800 !important;}
        
        @keyframes redGlow { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* ====== MODALS ====== */
        .modal-overlay, #sidebarBackdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); z-index: 2000; display: none; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.2s;}
        .modal-overlay.open, #sidebarBackdrop.open { display: flex; opacity: 1; }
        .modal-sheet { width: 100%; max-width: 500px; background: var(--bg-sheet); border-radius: 24px 24px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s; }
        .modal-overlay.open .modal-sheet { transform: translateY(0); }
        .modal-sheet::before { content: ""; display: block; width: 40px; height: 4px; background: #cbd5e1; border-radius: 10px; margin: 0 auto 16px; }

        .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .sheet-title { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px;}
        .sheet-close-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; color: var(--text-sub); cursor: pointer; }

        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; }
        .form-input, .form-select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.95rem; font-weight: 600; background: #f8fafc; outline: none; }
        .form-input:focus, .form-select:focus { border-color: var(--accent); background: #ffffff; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn-action-primary { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-danger-outline { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.05); color: #ef4444; border: 1px solid #ef4444; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* ====== SETTINGS & SIDEBAR ====== */
        #settings-page { position: fixed; inset: 0; background: var(--bg-base); z-index: 4000; transform: translateX(100%); transition: transform 0.2s; display: flex; flex-direction: column; }
        #settings-page.open { transform: translateX(0); }
        .settings-header { background: #ffffff; padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .settings-body { flex: 1; overflow-y: auto; padding: 16px; }
        .settings-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }

        #sidebar-drawer { position: fixed; top: 0; left: 0; width: 80%; max-width: 300px; height: 100%; background: #ffffff; z-index: 3000; transform: translateX(-100%); transition: transform 0.2s; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
        #sidebar-drawer.open { transform: translateX(0); }
        .sidebar-header-gradient { padding: 24px 16px 16px; background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; }
        .user-profile-img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; object-fit: cover; margin-bottom: 10px; display: none; background: white;}
        .sidebar-menu-list { flex: 1; overflow-y: auto; padding: 16px; }
        .menu-category-title { font-size: 0.7rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin: 16px 0 8px 4px; }
        .menu-link-btn { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 600; cursor: pointer; background: transparent; color: var(--text-main);}
        .menu-link-btn:active { background: #f1f5f9; }
        .menu-link-btn i { font-size: 1.1rem; width: 20px; text-align: center; }

        #move-confirm-bar { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 12px; right: 12px; z-index: 2500; background: #ffffff; border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-md); display: none; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>

<div id="app-container">
    
    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-logo"><i class="fa-solid fa-bolt-lightning"></i></div>
        <h1 class="splash-title">DISCOM Pro</h1>
        <p class="splash-subtitle">Enterprise Survey App</p>
        <div class="splash-loader"></div>
    </div>

    <div id="app-toast"><i class="fa-solid fa-circle-check" style="color:#4ade80;"></i> <span id="toast-msg">Success</span></div>

    <!-- TOP BAR -->
    <div id="top-bar">
        <div class="header-glass">
            <div class="header-title-group">
                <div class="action-btn-sm" onclick="toggleSidebar(true)"><i class="fa-solid fa-bars"></i></div>
                <select id="feederSelectHeader" class="modern-select" onchange="switchFeeder(this.value)"></select>
                <button class="action-btn-sm" onclick="openAddNewFeederModal()"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div class="header-actions">
                <button class="action-btn-sm bg" onclick="runOrphanNodeChecker()"><i class="fa-solid fa-network-wired" style="color:#d97706;"></i></button>
            </div>
        </div>
        <div class="kpi-row">
            <div class="kpi-tile"><div class="kpi-label">11 KV Line</div><div class="kpi-val" id="kpiLength">0 M</div></div>
            <div class="kpi-tile"><div class="kpi-label">DT</div><div class="kpi-val" id="kpiDT">0</div></div>
            <div class="kpi-tile"><div class="kpi-label">Load</div><div class="kpi-val" id="kpiLoad">0 kVA</div></div>
            <div class="kpi-tile"><div class="kpi-label">Cons.</div><div class="kpi-val" id="kpiConsumers">0</div></div>
        </div>
    </div>

    <div id="layer-indicator">Hybrid Map</div>

    <!-- MAP CANVAS -->
    <div id="map"></div>

    <div id="center-crosshair"><i class="fa-solid fa-plus"></i></div>
    <div id="reticle-coordinates">0.000000, 0.000000</div>

    <div class="right-tools-stack">
        <button class="round-tool-btn" onclick="toggleMapLayer()"><i class="fa-solid fa-layer-group" style="color:#0ea5e9;"></i></button>
        <button class="round-tool-btn" id="liveTrackBtn" onclick="toggleLiveTracking()"><i class="fa-solid fa-crosshairs" style="color:#ef4444;"></i></button>
        <button class="round-tool-btn" onclick="openFilterModal()"><i class="fa-solid fa-filter" style="color:#d97706;"></i></button>
        <button class="round-tool-btn undo-btn" onclick="undoLastAction()"><i class="fa-solid fa-rotate-left"></i></button>
    </div>

    <div id="speed-dial-menu">
        <div class="dial-grid">
            <div class="dial-card" onclick="openAddForm('POLE')"><i class="fa-solid fa-grip-lines-vertical" style="color:#0ea5e9;"></i><span>HT Pole</span></div>
            <div class="dial-card" onclick="openAddForm('LTPOLE')"><i class="fa-solid fa-grip-lines-vertical" style="color:#10b981;"></i><span>LT Pole</span></div>
            <div class="dial-card" onclick="openAddForm('LINE')"><i class="fa-solid fa-arrow-trend-up" style="color:#2563eb;"></i><span>Line</span></div>
            <div class="dial-card" onclick="openAddForm('DT')"><i class="fa-solid fa-bolt" style="color:#f59e0b;"></i><span>DT</span></div>
            <div class="dial-card" onclick="openAddForm('CONSUMER')"><i class="fa-solid fa-user-plus" style="color:#3b82f6;"></i><span>Consumer</span></div>
        </div>
    </div>

    <div id="bottom-single-action">
        <div class="center-plus-fab" id="mainFabBtn" onclick="toggleSpeedDial()"><i class="fa-solid fa-plus"></i></div>
    </div>

    <div id="move-confirm-bar">
        <div><b id="moveTargetTitle" style="color:var(--accent); font-size:1.0rem;">Target</b></div>
        <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn-action-primary" style="margin:0;" onclick="confirmObjectMove()">Set Here</button>
            <button class="btn-danger-outline" style="margin:0;" onclick="cancelObjectMove()">Cancel</button>
        </div>
    </div>
</div>

<!-- SETTINGS PAGE -->
<div id="settings-page">
    <div class="settings-header">
        <button class="action-btn-sm" style="border:none; background:transparent; font-size:1.3rem;" onclick="closeSettingsPage()"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 style="font-size:1.1rem; font-weight:800;">Settings</h2>
    </div>
    <div class="settings-body">
        <div class="settings-card">
            <div class="form-row" style="margin-bottom:0;">
                <label>Language</label>
                <select id="setLanguage" class="form-select" onchange="autoSaveSettings()">
                    <option value="en" selected>English</option>
                </select>
            </div>
        </div>
        <div class="settings-card" style="border-color: #ef4444; background:#fef2f2;">
            <button type="button" class="btn-danger-outline" onclick="openResetConfirmationModal()"><i class="fa-solid fa-trash-can"></i> Reset Data</button>
        </div>
    </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
<div id="sidebar-drawer">
    <div class="sidebar-header-gradient">
        <img id="sidebarProfileImg" class="user-profile-img" src="" alt="Profile">
        <h3 id="userNameDisplay" style="font-size:1rem; font-weight:700; display:none; margin-top:5px;"></h3>
        <p id="userEmailDisplay" style="font-size:0.75rem; opacity:0.9; margin-top:2px; display:none;"></p>
        <div id="googleAuthBox" style="margin-top: 10px;">
            <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
            <div class="g_id_signin" data-type="standard" data-theme="filled_blue" data-shape="rectangular" data-size="medium" data-width="100%"></div>
        </div>
    </div>

    <div class="sidebar-menu-list">
        <div class="menu-link-btn" onclick="openFeederConfigModal()" style="background:#eff6ff; color:#1d4ed8;">
            <i class="fa-solid fa-tower-broadcast"></i> <span>Feeder Config</span>
        </div>

        <div class="menu-category-title">Export (Folder Location)</div>
        <div class="menu-link-btn" onclick="generateCadSLDPdf()"><i class="fa-solid fa-file-pdf" style="color:#ef4444;"></i> <span>Export PDF</span></div>
        <div class="menu-link-btn" onclick="exportToAutoCAD_DXF()"><i class="fa-solid fa-draw-polygon" style="color:#10b981;"></i> <span>Export DXF</span></div>
        <div class="menu-link-btn" onclick="exportToGoogleEarth_KML()"><i class="fa-solid fa-earth-americas" style="color:#0ea5e9;"></i> <span>Export KML</span></div>
        <div class="menu-link-btn" onclick="exportDataToCSV()"><i class="fa-solid fa-file-csv" style="color:#f59e0b;"></i> <span>Export CSV (GE Ready)</span></div>

        <div class="menu-category-title">Import</div>
        <label class="menu-link-btn">
            <i class="fa-solid fa-file-import" style="color:#8b5cf6;"></i><span>Import Data</span>
            <input type="file" id="csvFileInput" accept=".csv,text/csv,.json,application/json" style="display:none;" onchange="handleImportChoice(event)">
        </label>

        <div class="menu-category-title">System</div>
        <div class="menu-link-btn" onclick="openSettingsPage()"><i class="fa-solid fa-gear" style="color:#64748b;"></i><span>Settings</span></div>
    </div>
</div>

<div class="modal-overlay" id="formModalOverlay"><div class="modal-sheet" id="modalSheetContent"></div></div>
<canvas id="cad-canvas" style="display:none;"></canvas>

<!-- APP LOGIC -->
<script>
    const DB_KEY = "DISCOM_ENTERPRISE_DB";
    
    let appState = {
        settings: { checkOrphanNode: true, language: 'en', gpsInterval: 3, gpsDistance: 2 },
        user: { isLoggedIn: false, name: "", email: "", photoUrl: "" },
        filters: { lines33: true, lines11: true, linesLT: true, poles: true, dts: true, consumers: true },
        currentFeederCode: "FDR-01",
        feeders: { 
            "FDR-01": { 
                feeder: { name: "11 kV Feeder-01", code: "FDR-01", subdivCode: "SD-01", parentGss: "GSS-01" }, 
                gss: { name: "132/33 kV GSS", code: "GSS-01", lat: 26.9150, lng: 75.7830 }, 
                poles: [], dts: [], lines: [], consumers: [] 
            } 
        },
        orphanPoleIds: new Set(), activeMove: null
    };

    let historyStack = [];

    function getActiveNetwork() {
        if (!appState.feeders[appState.currentFeederCode]) appState.currentFeederCode = Object.keys(appState.feeders)[0] || "FDR-01";
        let net = appState.feeders[appState.currentFeederCode];
        if (!net) { 
            net = { feeder: { name: "11 kV Feeder-01", code: "FDR-01", subdivCode: "SD-01", parentGss: "GSS-01" }, gss: { name: "132/33 kV GSS", code: "GSS-01", lat: 26.9150, lng: 75.7830 }, poles: [], dts: [], lines: [], consumers: [] }; 
            appState.feeders[appState.currentFeederCode] = net; 
        }
        if (!Array.isArray(net.poles)) net.poles = []; 
        if (!Array.isArray(net.lines)) net.lines = []; 
        if (!Array.isArray(net.dts)) net.dts = []; 
        if (!Array.isArray(net.consumers)) net.consumers = [];
        return net;
    }

    function showToast(msg) {
        const toast = document.getElementById('app-toast'); const msgElem = document.getElementById('toast-msg');
        if (!toast || !msgElem) return; msgElem.innerText = msg;
        toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3500);
    }

    async function triggerPersistence() { try { await localforage.setItem(DB_KEY, appState); } catch (err) { localStorage.setItem(DB_KEY, JSON.stringify(appState)); } }

    async function loadPersistedData(callback) {
        try { const data = await localforage.getItem(DB_KEY); if (data && data.feeders) appState = data; else { const lsData = localStorage.getItem(DB_KEY); if(lsData) appState = JSON.parse(lsData); } } catch(e) {}
        if (callback) callback();
    }

    function saveSnapshot() {
        const net = getActiveNetwork(); historyStack.push(JSON.parse(JSON.stringify({ poles: net.poles, lines: net.lines, dts: net.dts, consumers: net.consumers })));
        if (historyStack.length > 15) historyStack.shift();
    }

    /* GLOBAL WINDOW ATTACHMENT FOR POPUP BUTTONS */
    window.undoLastAction = function() {
        if (historyStack.length === 0) return showToast("No actions to Undo!");
        const prevState = historyStack.pop(); const net = getActiveNetwork();
        net.poles = prevState.poles; net.lines = prevState.lines; net.dts = prevState.dts; net.consumers = prevState.consumers;
        renderEntireNetwork(); triggerPersistence(); showToast("Undo Successful ↺");
    }

    window.autoSaveSettings = function() { triggerPersistence(); showToast("Settings Saved!"); }

    window.toggleSpeedDial = function(force) {
        const dial = document.getElementById('speed-dial-menu'), fab = document.getElementById('mainFabBtn');
        if (!dial || !fab) return; const isOpen = force !== undefined ? force : !dial.classList.contains('active');
        dial.classList.toggle('active', isOpen); fab.classList.toggle('open', isOpen);
    }

    window.toggleSidebar = function(open) { document.getElementById('sidebar-drawer').classList.toggle('open', open); document.getElementById('sidebarBackdrop').classList.toggle('open', open); }
    window.openModal = function(html) { document.getElementById('modalSheetContent').innerHTML = html; document.getElementById('formModalOverlay').classList.add('open'); }
    window.closeModal = function() { document.getElementById('formModalOverlay').classList.remove('open'); }
    window.openSettingsPage = function() { toggleSidebar(false); document.getElementById('settings-page').classList.add('open'); }
    window.closeSettingsPage = function() { document.getElementById('settings-page').classList.remove('open'); }

    window.switchFeeder = function(code) { if (appState.feeders[code]) { appState.currentFeederCode = code; renderEntireNetwork(); triggerPersistence(); const net = getActiveNetwork(); if (net.gss && net.gss.lat) map.flyTo([net.gss.lat, net.gss.lng], 16); } }

    function getLineSpec(type) {
        const t = (type || '').toUpperCase();
        if (t.includes('33')) return { name: '33 KV', color: '#ef4444', weight: 4, dash: '8,8', filterKey: 'lines33' };
        if (t.includes('LT')) return { name: 'LT LINE', color: '#10b981', weight: 2.5, dash: null, filterKey: 'linesLT' };
        return { name: '11 KV LINE', color: '#2563eb', weight: 3.5, dash: null, filterKey: 'lines11' };
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
        const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function formatDistance(meters) { return `${meters.toFixed(1)} M`; }
    function getNodeCoords(nodeId) { 
        const net = getActiveNetwork(); 
        if (nodeId === 'GSS' || nodeId === net.gss.code) return { lat: net.gss.lat, lng: net.gss.lng }; 
        if (nodeId === 'FEEDER' || nodeId === net.feeder.code) return { lat: net.gss.lat, lng: net.gss.lng };
        const p = net.poles.find(x => x.poleNo == nodeId); 
        if (p) return { lat: p.lat, lng: p.lng };
        const d = net.dts.find(x => x.code == nodeId);
        if (d) return { lat: d.lat, lng: d.lng };
        return null; 
    }

    function computeParallelOffset(coords, offsetMeters) {
        if (!coords || coords.length < 2 || offsetMeters === 0) return coords;
        const lat1 = coords[0][0], lon1 = coords[0][1], lat2 = coords[1][0], lon2 = coords[1][1];
        const midLat = (lat1 + lat2) / 2; const cosLat = Math.cos(midLat * Math.PI / 180);
        const mPerDegLat = 111139, mPerDegLon = 111139 * cosLat;
        const dx = (lon2 - lon1) * mPerDegLon, dy = (lat2 - lat1) * mPerDegLat; const len = Math.sqrt(dx * dx + dy * dy);
        if (len === 0) return coords; const nx = -dy / len, ny = dx / len;
        return [[lat1 + (ny * offsetMeters) / mPerDegLat, lon1 + (nx * offsetMeters) / mPerDegLon], [lat2 + (ny * offsetMeters) / mPerDegLat, lon2 + (nx * offsetMeters) / mPerDegLon]];
    }

    window.runOrphanNodeChecker = function() {
        updateOrphanStatus();
        renderEntireNetwork();
        showToast("Orphan Network Checked!");
    }

    function updateOrphanStatus() {
        appState.orphanPoleIds.clear();
        const net = getActiveNetwork(); const adj = {};
        
        adj[net.gss.code] = []; adj[net.feeder.code] = [];
        net.poles.forEach(p => adj[p.poleNo] = []);
        net.dts.forEach(d => { 
            adj[d.code] = []; 
            if(d.parentPole) {
                if(!adj[d.parentPole]) adj[d.parentPole] = [];
                adj[d.parentPole].push(d.code); 
                adj[d.code].push(d.parentPole); 
            } 
        });

        net.lines.forEach(l => { 
            if (!adj[l.fromNode]) adj[l.fromNode] = []; 
            if (!adj[l.toNode]) adj[l.toNode] = []; 
            adj[l.fromNode].push(l.toNode); 
            adj[l.toNode].push(l.fromNode); 
        });

        const visited = new Set([net.gss.code, net.feeder.code]); 
        const queue = [net.gss.code, net.feeder.code];
        
        while (queue.length > 0) { 
            const curr = queue.shift(); 
            (adj[curr] || []).forEach(neighbor => { 
                if (!visited.has(neighbor)) { 
                    visited.add(neighbor); queue.push(neighbor); 
                } 
            }); 
        }

        net.poles.forEach(p => { if (!visited.has(p.poleNo)) appState.orphanPoleIds.add(p.id); });
        net.dts.forEach(d => { if (!visited.has(d.code)) appState.orphanPoleIds.add(d.id); });
    }

    /* ====== 1. OSM LAYER INTEGRATION ====== */
    const map = L.map('map', { zoomControl: false, attributionControl: false, preferCanvas: true, rotate: true }).setView([26.9150, 75.7830], 16);
    const tileLayers = { 
        hybrid: { name: 'Hybrid Map', layer: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 22 }) }, 
        osm: { name: 'OpenStreetMap', layer: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }) },
        streets: { name: 'Street Map', layer: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 22 }) }
    };
    let currentTileIndex = 0; const layerKeys = Object.keys(tileLayers); 
    tileLayers[layerKeys[currentTileIndex]].layer.addTo(map);

    window.toggleMapLayer = function() { 
        map.removeLayer(tileLayers[layerKeys[currentTileIndex]].layer); 
        currentTileIndex = (currentTileIndex + 1) % layerKeys.length; 
        tileLayers[layerKeys[currentTileIndex]].layer.addTo(map); 
        document.getElementById('layer-indicator').innerText = tileLayers[layerKeys[currentTileIndex]].name;
    }

    // Leaflet Panes for Z-Index Control (Consumer > LT Pole > LT Line > DT > HT Pole > GSS)
    map.createPane('gssPane'); map.getPane('gssPane').style.zIndex = 400;
    map.createPane('htPolePane'); map.getPane('htPolePane').style.zIndex = 450;
    map.createPane('dtPane'); map.getPane('dtPane').style.zIndex = 500;
    map.createPane('ltLinePane'); map.getPane('ltLinePane').style.zIndex = 550;
    map.createPane('htLinePane'); map.getPane('htLinePane').style.zIndex = 560;
    map.createPane('ltPolePane'); map.getPane('ltPolePane').style.zIndex = 600;
    map.createPane('consumerPane'); map.getPane('consumerPane').style.zIndex = 700;

    const featureGroups = { 
        gss: L.layerGroup().addTo(map), 
        lines: L.layerGroup().addTo(map), 
        poles: L.layerGroup().addTo(map), 
        dts: L.layerGroup().addTo(map), 
        consumers: L.layerGroup().addTo(map), 
        consumerLines: L.layerGroup().addTo(map) 
    };

    map.on('move', () => { const c = map.getCenter(); document.getElementById('reticle-coordinates').innerText = `${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`; });
    map.on('zoomend', () => renderEntireNetwork());

    window.openFilterModal = function() {
        const f = appState.filters;
        openModal(`<div class="sheet-head"><div class="sheet-title"><i class="fa-solid fa-filter" style="color:#d97706;"></i> Object Filter</div><button class="sheet-close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>11 KV Line</b><label><input type="checkbox" id="flt11" ${f.lines11?'checked':''}></label></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>33 KV Line</b><label><input type="checkbox" id="flt33" ${f.lines33?'checked':''}></label></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>LT Line</b><label><input type="checkbox" id="fltLT" ${f.linesLT?'checked':''}></label></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>Poles</b><label><input type="checkbox" id="fltPoles" ${f.poles?'checked':''}></label></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>DT</b><label><input type="checkbox" id="fltDTs" ${f.dts?'checked':''}></label></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>Consumers</b><label><input type="checkbox" id="fltCons" ${f.consumers?'checked':''}></label></div>
            </div><button class="btn-action-primary" onclick="saveFilters()">Apply</button>`);
    }
    window.saveFilters = function() {
        appState.filters.lines11 = document.getElementById('flt11').checked; appState.filters.lines33 = document.getElementById('flt33').checked; appState.filters.linesLT = document.getElementById('fltLT').checked;
        appState.filters.poles = document.getElementById('fltPoles').checked; appState.filters.dts = document.getElementById('fltDTs').checked; appState.filters.consumers = document.getElementById('fltCons').checked;
        closeModal(); renderEntireNetwork(); showToast("Filters Updated");
    }

    function renderEntireNetwork() {
        try {
            updateOrphanStatus(); Object.values(featureGroups).forEach(g => g.clearLayers());
            const net = getActiveNetwork(), f = appState.filters, currentZoom = map.getZoom();
            
            // Map Zoom Behavior Control
            const showConsumers = currentZoom >= 19 && f.consumers;
            const showLTPoles = currentZoom >= 17 && f.poles;
            const showDTs = currentZoom >= 16 && f.dts;
            const showHTPoles = currentZoom >= 15 && f.poles;
            const isGssMini = currentZoom < 14;

            if (net.gss && typeof net.gss.lat === 'number') {
                const gssIcon = isGssMini ? L.divIcon({ className: 'gss-mini-dot', iconSize: [16,16], iconAnchor: [8,8] }) : L.divIcon({ className: 'gss-square-icon', html: `<span>GSS</span>`, iconSize: [32,32], iconAnchor: [16,16] });
                const m = L.marker([net.gss.lat, net.gss.lng], { icon: gssIcon, pane: 'gssPane' });
                m.bindPopup(`<div style="padding:4px;"><b style="color:#b91c1c; font-size:1.1rem;">GSS / Root: ${net.gss.name}</b><br><small>Code: ${net.gss.code}</small></div>`);
                featureGroups.gss.addLayer(m);
            }

            const spanBuckets = {};
            net.lines.forEach(line => {
                if (!line.coords || line.coords.length < 2) { 
                    const c1 = getNodeCoords(line.fromNode); const c2 = getNodeCoords(line.toNode); 
                    if (c1 && c2) { line.coords = [[c1.lat, c1.lng], [c2.lat, c2.lng]]; line.distanceMeters = calcDistance(c1.lat, c1.lng, c2.lat, c2.lng); } 
                    else return; 
                }
                const spec = getLineSpec(line.type); if (!f[spec.filterKey]) return;
                const spanKey = [line.fromNode, line.toNode].sort().join('<-->'); if (!spanBuckets[spanKey]) spanBuckets[spanKey] = []; spanBuckets[spanKey].push(line);
            });

            Object.keys(spanBuckets).forEach(spanKey => {
                const linesInSpan = spanBuckets[spanKey]; const totalInSpan = linesInSpan.length;
                linesInSpan.forEach((line, idx) => {
                    const spec = getLineSpec(line.type); let offsetMeters = (totalInSpan > 1) ? (idx - (totalInSpan - 1) / 2) * 3.2 : 0;
                    const shiftedCoords = computeParallelOffset(line.coords, offsetMeters);
                    
                    const isLT = spec.name.includes('LT');
                    const targetPane = isLT ? 'ltLinePane' : 'htLinePane';
                    
                    if (isLT && !showLTPoles) return;

                    const hitPoly = L.polyline(shiftedCoords, { color: 'transparent', weight: 25, pane: targetPane }).addTo(featureGroups.lines);
                    L.polyline(shiftedCoords, { color: spec.color, weight: spec.weight, dashArray: spec.dash, lineCap: 'round', interactive: false, pane: targetPane }).addTo(featureGroups.lines);
                    
                    hitPoly.bindPopup(`<div style="padding:4px;"><b style="color:${spec.color};">${spec.name}</b><p style="margin:4px 0;">From-To: <b>${line.fromNode} ➔ ${line.toNode}</b></p><p style="margin:4px 0;">Distance: <b>${formatDistance(line.distanceMeters||0)}</b></p><button style="width:100%; padding:8px; background:#fee2e2; color:#dc2626; border:none; border-radius:6px; font-weight:700;" onclick="window.deleteEntity('line','${line.id}')">Delete</button></div>`);
                });
            });

            if (f.poles) {
                net.poles.forEach(p => {
                    const isOrphan = appState.orphanPoleIds.has(p.id); 
                    const isLT = p.lineType === 'LT';
                    
                    if (isLT && !showLTPoles && !isOrphan) return;
                    if (!isLT && !showHTPoles && !isOrphan) return;

                    const iconClass = isLT ? 'lt-pole-icon' : 'pole-marker-icon';
                    const pane = isLT ? 'ltPolePane' : 'htPolePane';

                    // For LT poles, show only the unique number part (after the hyphen) in the icon
                    let displayNo = p.poleNo;
                    if (isLT && String(p.poleNo).includes('-')) {
                        displayNo = String(p.poleNo).split('-')[1];
                    }

                    const m = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: iconClass + (isOrphan ? ' orphan-pulse' : ''), html: `<span>${displayNo}</span>`, iconSize: [isLT?22:26, isLT?22:26], iconAnchor: [isLT?11:13, isLT?11:13] }), pane: pane });
                    
                    m.bindPopup(`<div style="padding:4px;"><b>Pole: ${p.poleNo} (${p.lineType || 'HT'})</b><p style="margin:4px 0; font-size:0.8rem;">Parent: ${p.dtCode || 'Feeder'}</p><div style="display:flex; gap:6px; margin-top:8px;"><button style="flex:1; padding:8px; background:#eff6ff; border:none; border-radius:6px;" onclick="window.openEditModal('pole','${p.id}')">Edit</button><button style="flex:1; padding:8px; background:#fef3c7; border:none; border-radius:6px;" onclick="window.startObjectMove('POLE','${p.id}','${p.poleNo}')">Move</button><button style="flex:1; padding:8px; background:#fee2e2; color:#dc2626; border:none; border-radius:6px;" onclick="window.deleteEntity('pole','${p.id}')">Delete</button></div></div>`);
                    featureGroups.poles.addLayer(m);
                });
            }

            if (f.dts && showDTs) {
                net.dts.forEach(d => {
                    const isOrphan = appState.orphanPoleIds.has(d.id);
                    if (!d.lat || !d.lng) { 
                        const p = net.poles.find(x => x.poleNo == d.parentPole); 
                        if (p) { d.lat = p.lat; d.lng = p.lng; } 
                        else { d.lat = net.gss.lat; d.lng = net.gss.lng; }
                    }
                    const m = L.marker([d.lat, d.lng], { icon: L.divIcon({ className: 'dt-square-icon' + (isOrphan ? ' orphan-pulse' : ''), html: `${d.rating}`, iconSize: [22,22], iconAnchor: [11,11] }), pane: 'dtPane' });
                    m.bindPopup(`<div style="padding:4px;"><b style="color:#d97706;">DT: ${d.code}</b><p style="margin:4px 0;">Rating: ${d.rating} kVA<br>Parent Pole/Feeder: ${d.parentPole}</p><div style="display:flex; gap:6px; margin-top:8px;"><button style="flex:1; padding:8px; background:#eff6ff; border:none; border-radius:6px;" onclick="window.openEditModal('dt','${d.id}')">Edit</button><button style="flex:1; padding:8px; background:#fef3c7; border:none; border-radius:6px;" onclick="window.startObjectMove('DT','${d.id}','${d.code}')">Move</button><button style="flex:1; padding:8px; background:#fee2e2; color:#dc2626; border:none; border-radius:6px;" onclick="window.deleteEntity('dt','${d.id}')">Delete</button></div></div>`);
                    featureGroups.dts.addLayer(m);
                });
            }

            if (showConsumers) {
                net.consumers.forEach(c => {
                    let parentCoord = null;
                    if (c.parentType === 'POLE') {
                        const p = net.poles.find(x => x.poleNo == c.parentRef);
                        if (p) parentCoord = { lat: p.lat, lng: p.lng };
                    } else if (c.parentType === 'DT') {
                        const d = net.dts.find(x => x.code == c.parentRef);
                        if (d) parentCoord = { lat: d.lat, lng: d.lng };
                    }
                    if (!parentCoord) parentCoord = { lat: net.gss.lat, lng: net.gss.lng };

                    if (!c.lat || !c.lng) {
                        c.lat = parentCoord.lat + 0.0001; c.lng = parentCoord.lng + 0.0001;
                    }

                    if (f.poles && currentZoom >= 16) { 
                        L.polyline([[parentCoord.lat, parentCoord.lng], [c.lat, c.lng]], { color: '#3b82f6', weight: 1, dashArray: '2,4', pane: 'consumerPane' }).addTo(featureGroups.consumerLines); 
                    }
                    
                    const m = L.marker([c.lat, c.lng], { icon: L.divIcon({ className: 'consumer-marker-icon', html: `<i class="fa-solid fa-house"></i>`, iconSize: [18,18], iconAnchor: [9,9] }), pane: 'consumerPane' });
                    m.bindPopup(`<div style="padding:4px;"><b>${c.name}</b><p style="color:#64748b; margin:4px 0;">K-No: ${c.kno} | Connected to: ${c.parentRef}</p><div style="display:flex; gap:6px; margin-top:8px;"><button style="flex:1; padding:6px; background:#eff6ff; border:none; border-radius:6px;" onclick="window.openEditModal('consumer','${c.id}')">Edit</button><button style="flex:1; padding:6px; background:#fef3c7; border:none; border-radius:6px;" onclick="window.startObjectMove('CONSUMER','${c.id}','${c.name}')">Move</button><button style="flex:1; padding:6px; background:#fee2e2; color:#dc2626; border:none; border-radius:6px;" onclick="window.deleteEntity('consumer','${c.id}')">Delete</button></div></div>`);
                    featureGroups.consumers.addLayer(m);
                });
            }

            let tLine = 0; net.lines.forEach(l => { if (getLineSpec(l.type).name.includes('11') || getLineSpec(l.type).name.includes('33')) tLine += (l.distanceMeters || 0); });
            if(document.getElementById('kpiLength')) document.getElementById('kpiLength').innerText = formatDistance(tLine);
            let tLoad = 0; net.dts.forEach(d => tLoad += parseFloat(d.rating || 0));
            document.getElementById('kpiLoad').innerText = `${tLoad} kVA`; document.getElementById('kpiDT').innerText = net.dts.length; document.getElementById('kpiConsumers').innerText = net.consumers.length;
            const sel = document.getElementById('feederSelectHeader'); if(sel) sel.innerHTML = Object.keys(appState.feeders).map(code => `<option value="${code}" ${code === appState.currentFeederCode ? 'selected':''}>${appState.feeders[code].feeder.name}</option>`).join('');

        } catch(err) { console.error(err); }
    }

    /* ====== GLOBAL EDIT / DELETE / MOVE LOGIC ====== */
    window.deleteEntity = function(type, id) {
        const net = getActiveNetwork();
        if(!confirm("Are you sure you want to delete this item?")) return;
        saveSnapshot();
        if (type === 'pole') {
            const p = net.poles.find(x => x.id === id);
            if (p) {
                net.poles = net.poles.filter(x => x.id !== id);
                net.lines = net.lines.filter(l => l.fromNode != p.poleNo && l.toNode != p.poleNo);
                net.dts = net.dts.filter(d => d.parentPole != p.poleNo);
                net.consumers = net.consumers.filter(c => c.parentRef != p.poleNo);
            }
        } else if (type === 'line') net.lines = net.lines.filter(x => x.id !== id);
        else if (type === 'dt') {
            const d = net.dts.find(x => x.id === id);
            net.dts = net.dts.filter(x => x.id !== id);
            net.consumers = net.consumers.filter(c => c.parentRef != d.code);
            net.lines = net.lines.filter(l => l.fromNode != d.code && l.toNode != d.code);
            const ltPolesToRemove = net.poles.filter(p => p.dtCode == d.code).map(p => p.poleNo);
            net.poles = net.poles.filter(p => p.dtCode != d.code);
            net.lines = net.lines.filter(l => !ltPolesToRemove.includes(l.fromNode) && !ltPolesToRemove.includes(l.toNode));
        }
        else if (type === 'consumer') net.consumers = net.consumers.filter(x => x.id !== id);
        
        renderEntireNetwork(); triggerPersistence(); showToast("Deleted successfully!");
    }

    window.confirmObjectMove = function() {
        if (!appState.activeMove) return; saveSnapshot();
        const c = map.getCenter(); const net = getActiveNetwork(); const lat = parseFloat(c.lat.toFixed(6)), lng = parseFloat(c.lng.toFixed(6));
        if (appState.activeMove.type === 'POLE') {

            if (p) {
                p.lat = lat; p.lng = lng;
                net.dts.forEach(d => { if (d.parentPole == p.poleNo) { d.lat = lat; d.lng = lng; } });
                net.lines.forEach(l => { if (l.fromNode == p.poleNo) { l.coords[0] = [lat, lng]; l.distanceMeters = calcDistance(lat, lng, l.coords[1][0], l.coords[1][1]); } if (l.toNode == p.poleNo) { l.coords[1] = [lat, lng]; l.distanceMeters = calcDistance(l.coords[0][0], l.coords[0][1], lat, lng); } });
            }
        } 
        else if (appState.activeMove.type === 'DT') { const dt = net.dts.find(x => x.id === appState.activeMove.id); if (dt) { dt.lat = lat; dt.lng = lng; } }
        else if (appState.activeMove.type === 'CONSUMER') { const cons = net.consumers.find(x => x.id === appState.activeMove.id); if (cons) { cons.lat = lat; cons.lng = lng; } }

    }

    function findNearestNode(lat, lng, validNodes) {
        let nearest = null, minDist = Infinity;
        validNodes.forEach(node => {
            const dist = calcDistance(lat, lng, node.lat, node.lng);
            if (dist < minDist) { minDist = dist; nearest = node; }
        });
        return nearest;
    }

    window.saveNewPole = function() { 
        saveSnapshot(); 
        const no = document.getElementById('inpPoleNo').value.trim(); 
        const category = document.getElementById('inpPoleCategory').value;
        const lat = parseFloat(document.getElementById('inpLat').value), lng = parseFloat(document.getElementById('inpLng').value); 
        if (!no) return alert("Enter pole number"); 
        const net = getActiveNetwork(); 
        if (net.poles.some(p => p.poleNo == no)) return alert(`Pole exists!`); 
        net.poles.push({ id: 'P_'+Date.now(), poleNo: no, lineType: category, lat, lng }); 
        closeModal(); renderEntireNetwork(); triggerPersistence(); showToast("HT Pole added successfully!");
    }

    window.saveNewLTPole = function() {
        saveSnapshot(); 
        const dtCode = document.getElementById('inpLTPoleDT').value;
        const category = document.getElementById('inpPoleCategory').value;
        const lat = parseFloat(document.getElementById('inpLat').value), lng = parseFloat(document.getElementById('inpLng').value); 
        if (!dtCode) return alert("Select DT"); 
        
        const net = getActiveNetwork(); 
        // Unique Sequential Numbering for LT Pole (e.g. 4501-1, 4501-2)
        const existingLTPoles = net.poles.filter(p => p.lineType === 'LT' && p.dtCode == dtCode);
        const nextSequence = existingLTPoles.length + 1;
        const finalPoleNo = `${dtCode}-${nextSequence}`;

        if (net.poles.some(p => p.poleNo == finalPoleNo)) return alert(`Pole ${finalPoleNo} exists!`); 
        
        net.poles.push({ id: 'P_'+Date.now(), poleNo: finalPoleNo, lineType: category, dtCode: dtCode, lat, lng }); 
        closeModal(); renderEntireNetwork(); triggerPersistence(); showToast("LT Pole added successfully!");
    }

    window.saveNewLine = function() { 
        saveSnapshot(); 
        const from = document.getElementById('inpFromNode').value, to = document.getElementById('inpToNode').value, type = document.getElementById('inpLineType').value; 
        if (from === to) return alert("Cannot connect node to itself!"); 
        if (!to) return alert("Please select a target node!");
        const net = getActiveNetwork(), spec = getLineSpec(type); 
        const c1 = getNodeCoords(from), c2 = getNodeCoords(to); 
        if(!c1 || !c2) return alert("Invalid node coordinates!");
        const dist = calcDistance(c1.lat, c1.lng, c2.lat, c2.lng); 
        net.lines.push({ id: 'LN_'+Date.now(), type: spec.name, fromNode: from, toNode: to, distanceMeters: dist, coords: [[c1.lat, c1.lng], [c2.lat, c2.lng]] }); 
        closeModal(); renderEntireNetwork(); triggerPersistence(); showToast("Line added successfully!");
    }

    window.saveNewDT = function() { 
        saveSnapshot(); 
        const parentRef = document.getElementById('inpDTParent').value; 
        const code = document.getElementById('inpDTCode').value.trim(); 
        const rating = parseFloat(document.getElementById('inpDTRating').value); 
        const phase = document.getElementById('inpDTPhase').value;
        const net = getActiveNetwork(); 
        let lat = net.gss.lat, lng = net.gss.lng;
        const p = net.poles.find(x => x.poleNo == parentRef);
        if (p) { lat = p.lat; lng = p.lng; }

        if (!code) return alert("Enter DT Code"); 
        net.dts.push({ id: 'DT_'+Date.now(), parentPole: parentRef, code, rating, phase, lat, lng }); 
        closeModal(); renderEntireNetwork(); triggerPersistence(); showToast("DT added successfully!");
    }

    window.saveNewConsumer = function() { 
        saveSnapshot(); 
        const parentRef = document.getElementById('inpConsParent').value; 
        const kno = document.getElementById('inpConsKno').value.trim(); 
        const name = document.getElementById('inpConsName').value.trim(); 
        const load = document.getElementById('inpConsLoad').value.trim(); 
        const net = getActiveNetwork(); 
        
        let parentType = 'POLE';
        let baseCoord = { lat: net.gss.lat, lng: net.gss.lng };
        const p = net.poles.find(x => x.poleNo == parentRef);
        if (p) { parentType = 'POLE'; baseCoord = { lat: p.lat, lng: p.lng }; }
        else {
            const d = net.dts.find(x => x.code == parentRef);
            if (d) { parentType = 'DT'; baseCoord = { lat: d.lat, lng: d.lng }; }
        }

        if (!name || !kno) return alert("Enter Consumer Name and K-No"); 
        net.consumers.push({ id: 'CS_'+Date.now(), parentRef, parentType, kno, name, load, lat: baseCoord.lat + 0.0001, lng: baseCoord.lng + 0.0001 }); 
        closeModal(); renderEntireNetwork(); triggerPersistence(); showToast("Consumer added successfully!");
    }

        if (liveTrackingId) { navigator.geolocation.clearWatch(liveTrackingId); liveTrackingId = null; if (liveLocMarker) map.removeLayer(liveLocMarker); liveLocMarker = null; btn.innerHTML = '<i class="fa-solid fa-crosshairs" style="color:#ef4444;"></i>'; } 
        else {
            if (!navigator.geolocation) return; btn.innerHTML = '<i class="fa-solid fa-crosshairs" style="color:#10b981;"></i>';
            liveTrackingId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    if (!liveLocMarker) { liveLocMarker = L.marker([lat, lng]).addTo(map); map.flyTo([lat, lng], 19); } 
                    else liveLocMarker.setLatLng([lat, lng]);
                }, (err) => { window.toggleLiveTracking(); }, { enableHighAccuracy: true, timeout: 12000 }
            );
        }
    }

    /* ====== 2. FIXED EXPORT TO FOLDER (SAVE AS) - LOCAL SYSTEM ONLY ====== */
    async function smartExportAskLocation(filename, dataBlobOrText, mimeType) {
        const blob = dataBlobOrText instanceof Blob ? dataBlobOrText : new Blob([dataBlobOrText], { type: mimeType });

        // 1. Android Cordova / Web Share API (Mobile Default)
        const file = new File([blob], filename, { type: mimeType });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try { await navigator.share({ title: filename, files: [file] }); showToast("✅ File exported successfully!"); return; } catch (err) {}
        }

        // 2. Desktop File System Access API
        if (window.showSaveFilePicker) {
            try {
                const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: 'Export File', accept: { [mimeType]: ['.csv', '.kml', '.dxf', '.pdf'] } }] });
                const writable = await handle.createWritable();
                await writable.write(blob); await writable.close();
                showToast("✅ Exported to chosen folder successfully!");
                return;
            } catch (err) { return; }
        }

        // 3. Absolute Fallback Standard Download (Browser)
        const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
        showToast("✅ Downloaded to device folder!");
    }

    window.getCSVString = function() {
        const net = getActiveNetwork(); let csv = "\uFEFFWKT,Name,Type,ParentNode,Details\n"; 
        if (net.gss && net.gss.lat) csv += `"POINT (${net.gss.lng} ${net.gss.lat})","${net.gss.name}","GSS","","Code: ${net.gss.code}"\n`;
        net.poles.forEach(p => csv += `"POINT (${p.lng} ${p.lat})","Pole ${p.poleNo}","POLE","${p.dtCode||p.poleNo}","Type: ${p.lineType}"\n`);
        net.dts.forEach(d => csv += `"POINT (${d.lng} ${d.lat})","DT ${d.code}","DT","${d.parentPole}","Rating: ${d.rating}kVA"\n`);
        net.consumers.forEach(c => csv += `"POINT (${c.lng} ${c.lat})","${c.name}","CONSUMER","${c.parentRef}","KNo: ${c.kno}"\n`);
        net.lines.forEach(l => { if (l.coords && l.coords.length === 2) csv += `"LINESTRING (${l.coords[0][1]} ${l.coords[0][0]}, ${l.coords[1][1]} ${l.coords[1][0]})","${l.type}","LINE","${l.fromNode} ➔ ${l.toNode}","Dist: ${(l.distanceMeters||0).toFixed(1)}m"\n`; });
        return csv;
    }

    window.exportDataToCSV = function() { toggleSidebar(false); smartExportAskLocation(`${getActiveNetwork().feeder.name.replace(/\s+/g, '_')}_GE.csv`, window.getCSVString(), "text/csv;charset=utf-8;"); }

    window.exportToAutoCAD_DXF = function() { 
        toggleSidebar(false); let dxf = "0\nSECTION\n2\nENTITIES\n"; 
        getActiveNetwork().lines.forEach(l => { if (l.coords && l.coords[0] && l.coords[1]) dxf += `0\nLINE\n8\n${l.type.replace(/\s+/g,'_')}\n10\n${l.coords[0][1]}\n20\n${l.coords[0][0]}\n30\n0\n11\n${l.coords[1][1]}\n21\n${l.coords[1][0]}\n31\n0\n`; }); 
        dxf += "0\nENDSEC\n0\nEOF\n"; smartExportAskLocation(`${getActiveNetwork().feeder.name.replace(/\s+/g, '_')}.dxf`, dxf, "application/dxf"); 
    }
    
    window.exportToGoogleEarth_KML = function() { 
        toggleSidebar(false); let kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${getActiveNetwork().feeder.name}</name>`; 
        getActiveNetwork().lines.forEach(l => { if (l.coords && l.coords[0] && l.coords[1]) kml += `<Placemark><name>${l.type}</name><LineString><coordinates>${l.coords[0][1]},${l.coords[0][0]},0 ${l.coords[1][1]},${l.coords[1][0]},0</coordinates></LineString></Placemark>`; }); 
        kml += "</Document></kml>"; smartExportAskLocation(`${getActiveNetwork().feeder.name.replace(/\s+/g, '_')}.kml`, kml, "application/vnd.google-earth.kml+xml"); 
    }
    
    window.generateCadSLDPdf = function() { 
        toggleSidebar(false); const net = getActiveNetwork(); const pts = [];
        if (net.gss && net.gss.lat) pts.push({ lat: net.gss.lat, lng: net.gss.lng });
        net.poles.forEach(p => pts.push({ lat: p.lat, lng: p.lng })); net.dts.forEach(d => pts.push({ lat: d.lat, lng: d.lng }));
        if (pts.length === 0) return alert("No data found");
        let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
        pts.forEach(p => { if(p.lat < minLat) minLat = p.lat; if(p.lat > maxLat) maxLat = p.lat; if(p.lng < minLng) minLng = p.lng; if(p.lng > maxLng) maxLng = p.lng; });
        let dLat = maxLat - minLat || 0.001, dLng = maxLng - minLng || 0.001;

        const canvas = document.getElementById('cad-canvas'); const ctx = canvas.getContext('2d');
        const W = 3508, H = 2480; canvas.width = W; canvas.height = H;
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H); ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 10; ctx.strokeRect(40, 40, W - 80, H - 80);
        ctx.fillStyle = "#0f172a"; ctx.font = "bold 50px Arial"; ctx.fillText(`SLD: ${net.feeder.name.toUpperCase()}`, 80, 120);

        const padX = 200, padY = 250, usableW = W - (padX * 2), usableH = H - (padY * 2), scale = Math.min(usableW / dLng, usableH / dLat);
        const xOff = padX + (usableW - (dLng * scale)) / 2, yOff = padY + (usableH - (dLat * scale)) / 2;
        const toX = (lng) => xOff + ((lng - minLng) * scale), toY = (lat) => H - (yOff + ((lat - minLat) * scale));

        net.lines.forEach(l => { if(!l.coords || l.coords.length < 2) return; const spec = getLineSpec(l.type); ctx.lineWidth = spec.weight * 2; ctx.strokeStyle = spec.color; ctx.beginPath(); ctx.moveTo(toX(l.coords[0][1]), toY(l.coords[0][0])); ctx.lineTo(toX(l.coords[1][1]), toY(l.coords[1][0])); ctx.stroke(); });
        net.poles.forEach(p => { const dx = toX(p.lng), dy = toY(p.lat); ctx.beginPath(); ctx.arc(dx, dy, 8, 0, 2 * Math.PI); ctx.fillStyle = "#fde047"; ctx.fill(); ctx.stroke(); });

        const { jsPDF } = window.jspdf; const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
        pdf.addImage(canvas.toDataURL('image/png', 1.0), 'PNG', 0, 0, 420, 297); smartExportAskLocation(`${net.feeder.name.replace(/\s+/g, '_')}_SLD.pdf`, pdf.output('blob'), "application/pdf");
    }

    window.handleImportChoice = function(e) { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ev => { try { const p = JSON.parse(ev.target.result); if(p.feeders) appState = p; renderEntireNetwork(); triggerPersistence(); showToast("Imported!"); } catch(err) { alert("Invalid File"); } }; r.readAsText(f); e.target.value = ''; }
    window.handleCredentialResponse = function(response) { if(response.credential) showToast("Google Login Success!"); }

    function initializeApplication() { loadPersistedData(() => { setTimeout(() => { const splash = document.getElementById('splash-screen'); if(splash) splash.classList.add('hidden'); }, 1800); renderEntireNetwork(); }); }
    document.addEventListener('deviceready', initializeApplication, false); window.addEventListener('DOMContentLoaded', () => { if (!window.cordova) initializeApplication(); });
</script>

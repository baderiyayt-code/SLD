<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>DISCOM Feeder Survey Pro</title>

    <!-- Cordova Script -->
    <script src="cordova.js"></script>

    <!-- Leaflet, FontAwesome, Export & DB Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.min.js"></script>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- DATABASE UPGRADE: LocalForage (IndexedDB Wrapper) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        :root {
            --bg-base: #f0f6ff; --bg-surface: #ffffff; --bg-card: #e0f2fe;
            --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.25);
            --line-33: #dc2626; --line-11: #2563eb; --line-lt: #16a34a;
            --text-main: #0f172a; --text-sub: #475569; --border: rgba(37, 99, 235, 0.18);
            --radius-xl: 20px; --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-base); color: var(--text-main); }
        #app-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }

        .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #cbd5e1; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* SEARCH BAR UI */
        #search-box-container { position: absolute; top: calc(env(safe-area-inset-top, 10px) + 60px); left: 12px; right: 12px; z-index: 1000; display: flex; gap: 6px; pointer-events: auto; }
        .search-input { flex: 1; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1); outline: none; font-weight: 600; }
        .search-btn { background: var(--accent); color: white; border: none; padding: 0 16px; border-radius: var(--radius-md); font-weight: bold; box-shadow: 0 4px 12px var(--accent-glow); cursor: pointer; }

        #top-bar { position: absolute; top: env(safe-area-inset-top, 10px); left: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .header-glass { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(14px); padding: 10px 14px; border-radius: var(--radius-xl); border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.12); pointer-events: auto; }
        .header-title-group { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .modern-select { appearance: none; background: #f8fafc; color: #2563eb; border: 1px solid var(--border); padding: 8px 14px; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 800; outline: none; cursor: pointer; max-width: 150px; }
        .action-btn-sm { width: 38px; height: 38px; border-radius: var(--radius-md); background: #f8fafc; color: var(--text-main); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; pointer-events: auto;}
        
        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; pointer-events: auto; }
        .kpi-tile { background: rgba(255, 255, 255, 0.95); padding: 8px 6px; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.06); }
        .kpi-label { font-size: 0.55rem; color: var(--text-sub); font-weight: 800; }
        .kpi-val { font-size: 0.85rem; font-weight: 900; color: var(--accent); margin-top: 2px; }

        #map { flex: 1; width: 100%; height: 100%; z-index: 1; }
        #center-reticle-ring { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; transform: translate(-50%, -50%); border: 2px dashed #2563eb; border-radius: 50%; background: rgba(37, 99, 235, 0.08); pointer-events: none; z-index: 999; }
        .reticle-core { width: 8px; height: 8px; background: #2563eb; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px #2563eb; }
        
        .right-tools-stack { position: absolute; right: 14px; bottom: calc(115px + env(safe-area-inset-bottom, 0px)); z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .round-tool-btn { width: 46px; height: 46px; background: #ffffff; color: var(--text-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.15); border: 1px solid var(--border); cursor: pointer; }
        
        /* UNDO BUTTON */
        .undo-btn { background: #d97706; color: white; border-color: #f59e0b; }
        
        #bottom-single-action { position: absolute; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 1002; }
        .center-plus-fab { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: 4px solid white; box-shadow: 0 10px 30px var(--accent-glow); display: flex; align-items: center; justify-content: center; font-size: 1.7rem; cursor: pointer; transition: transform 0.22s; }
        .center-plus-fab.open { transform: rotate(45deg); background: linear-gradient(135deg, #ef4444, #b91c1c); }

        #speed-dial-menu { position: absolute; bottom: calc(105px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(20px) scale(0.9); width: calc(100% - 32px); max-width: 410px; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(16px); border-radius: var(--radius-xl); padding: 14px; border: 1px solid var(--border); box-shadow: 0 16px 40px rgba(37, 99, 235, 0.2); display: none; opacity: 0; transition: all 0.22s; z-index: 1001; }
        #speed-dial-menu.active { display: block; opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        .dial-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .dial-card { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
        .dial-card span { font-size: 0.68rem; font-weight: 700; color: var(--text-main); }

        #app-toast { position: absolute; top: calc(180px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%) translateY(-20px); background: #10b981; color: #ffffff; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3); z-index: 3500; opacity: 0; pointer-events: none; transition: all 0.25s ease; white-space: nowrap;}
        #app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #app-toast.sync-toast { background: #2563eb; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3); }

        /* Markers */
        .pole-marker-icon { background: #475569; color: #ffffff; border: 1.5px solid #ffffff; border-radius: 50%; font-size: 8px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.25); width: 22px; height: 22px; }
        .dt-square-icon { background: #f59e0b; color: #ffffff; border: 2px solid #ffffff; border-radius: 4px; font-size: 8px; font-weight: 900; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; }
        .gss-square-icon { background: #b91c1c; color: #ffffff; border: 2px solid #ffffff; border-radius: 6px; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; }
        .consumer-marker-icon { background: #10b981; color: white; border: 1.5px solid white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 8px; }
        
        .live-location-dot { width: 16px; height: 16px; background-color: #2563eb; border: 3px solid #ffffff; border-radius: 50%; box-shadow: 0 0 10px rgba(37, 99, 235, 0.8); position: relative; }
        .live-location-pulse { position: absolute; top: -5px; left: -5px; width: 26px; height: 26px; background-color: rgba(37, 99, 235, 0.4); border-radius: 50%; animation: livePulse 1.5s infinite; }
        @keyframes livePulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        /* Modals & Settings */
        .modal-overlay, #sidebarBackdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); z-index: 2000; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.open, #sidebarBackdrop.open { display: flex; }
        .modal-sheet { width: 100%; max-width: 480px; background: #ffffff; border-radius: 24px 24px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.22s; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px;}
        .sheet-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); }
        .sheet-close-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
        
        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-sub); margin-bottom: 5px; }
        .form-input, .form-select { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.92rem; background: #f8fafc; font-weight: 600; outline:none;}
        .btn-action-primary { width: 100%; padding: 13px; background: var(--accent); color: white; border: none; border-radius: var(--radius-md); font-weight: 800; cursor: pointer; margin-top: 8px; }

        #settings-page { position: fixed; inset: 0; background: #f0f6ff; z-index: 4000; transform: translateX(100%); transition: transform 0.28s; display: flex; flex-direction: column; }
        #settings-page.open { transform: translateX(0); }
        .settings-header { background: #ffffff; padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .settings-body { flex: 1; overflow-y: auto; padding: 18px; }
        .settings-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; }

        #sidebar-drawer { position: fixed; top: 0; left: 0; width: 85%; max-width: 320px; height: 100%; background: #ffffff; z-index: 3000; transform: translateX(-100%); transition: transform 0.28s; display: flex; flex-direction: column; }
        #sidebar-drawer.open { transform: translateX(0); }
        .sidebar-menu-list { flex: 1; overflow-y: auto; padding: 14px; }
        .menu-link-btn { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 700; cursor: pointer; background: #f8fafc; border: 1px solid var(--border); margin-bottom: 8px;}
        #cad-canvas { display: none; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="app-toast">Action Completed</div>

    <!-- TOP BAR -->
    <div id="top-bar">
        <div class="header-glass">
            <div class="header-title-group">
                <i class="fa-solid fa-bars" style="cursor:pointer; font-size:1.25rem; color:#2563eb;" onclick="toggleSidebar(true)"></i>
                <select id="feederSelectHeader" class="modern-select" onchange="switchFeeder(this.value)"></select>
                <button class="action-btn-sm" onclick="openAddNewFeederModal()"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>
        <div class="kpi-row">
            <div class="kpi-tile"><div class="kpi-label" data-i18n="line_11kv">11 KV लाइन</div><div class="kpi-val" id="kpiLength">0 M</div></div>
            <div class="kpi-tile"><div class="kpi-label" data-i18n="total_load">कुल लोड</div><div class="kpi-val" id="kpiLoad">0 kVA</div></div>
            <div class="kpi-tile"><div class="kpi-label" data-i18n="transformers">ट्रांसफार्मर</div><div class="kpi-val" id="kpiDT">0</div></div>
            <div class="kpi-tile"><div class="kpi-label" data-i18n="consumers">उपभोक्ता</div><div class="kpi-val" id="kpiConsumers">0</div></div>
        </div>
    </div>

    <!-- SEARCH BAR -->
    <div id="search-box-container">
        <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="search_placeholder" placeholder="खोजें (Pole No, K-No, Name)...">
        <button class="search-btn" onclick="executeSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <!-- MAP CANVAS -->
    <div id="map"></div>

    <div id="center-reticle-ring"><div class="reticle-core"></div></div>

    <!-- RIGHT FLOATING TOOLS -->
    <div class="right-tools-stack">
        <button class="round-tool-btn" onclick="toggleMapLayer()"><i class="fa-solid fa-layer-group" style="color:#0284c7;"></i></button>
        <button class="round-tool-btn" id="liveTrackBtn" onclick="toggleLiveTracking()"><i class="fa-solid fa-crosshairs" style="color:#ef4444;"></i></button>
        <!-- UNDO BUTTON -->
        <button class="round-tool-btn undo-btn" onclick="undoLastAction()" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
    </div>

    <!-- SPEED DIAL -->
    <div id="speed-dial-menu">
        <div class="dial-grid">
            <div class="dial-card" onclick="openAddForm('POLE')"><i class="fa-solid fa-grip-lines-vertical" style="color:#0284c7;"></i><span data-i18n="add_pole">+ खंभा</span></div>
            <div class="dial-card" onclick="openAddForm('LINE')"><i class="fa-solid fa-arrow-trend-up" style="color:#2563eb;"></i><span data-i18n="add_line">+ लाइन</span></div>
            <div class="dial-card" onclick="openAddForm('DT')"><i class="fa-solid fa-bolt" style="color:#d97706;"></i><span data-i18n="add_dt">+ DT</span></div>
            <div class="dial-card" onclick="openAddForm('CONSUMER')"><i class="fa-solid fa-user-plus" style="color:#10b981;"></i><span data-i18n="add_consumer">+ उपभोक्ता</span></div>
        </div>
    </div>

    <div id="bottom-single-action">
        <div class="center-plus-fab" id="mainFabBtn" onclick="toggleSpeedDial()"><i class="fa-solid fa-plus"></i></div>
    </div>
</div>

<!-- ================= SETTINGS PAGE ================= -->
<div id="settings-page">
    <div class="settings-header">
        <button class="action-btn-sm" onclick="closeSettingsPage()"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 style="font-size:1.1rem; font-weight:800;" data-i18n="settings_title">सेटिंग्स</h2>
    </div>
    <div class="settings-body">
        
        <div class="settings-card">
            <div class="form-row">
                <label data-i18n="language">भाषा (Language)</label>
                <select id="setLanguage" class="form-select" onchange="changeLanguage(this.value)">
                    <option value="hi" selected>हिंदी (Hindi)</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <div class="settings-card">
            <h3 style="font-size:0.9rem; margin-bottom:10px;" data-i18n="gps_tracking_settings">GPS स्मार्ट ट्रैकिंग सेटिंग्स</h3>
            <div class="form-grid-2">
                <div class="form-row">
                    <label data-i18n="gps_interval">ट्रैकिंग टाइम (Seconds)</label>
                    <input type="number" id="setGpsInterval" class="form-input" value="3">
                </div>
                <div class="form-row">
                    <label data-i18n="gps_distance">दूरी (Meters)</label>
                    <input type="number" id="setGpsDistance" class="form-input" value="2">
                </div>
            </div>
            <p style="font-size:0.7rem; color:var(--text-sub);" data-i18n="gps_hint">बैटरी बचाने के लिए ट्रैकिंग केवल तय समय और दूरी के बाद अपडेट होगी।</p>
        </div>

        <button class="btn-action-primary" onclick="saveSettings()" data-i18n="save_settings">सेटिंग्स सेव करें</button>
    </div>
</div>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
<div id="sidebar-drawer">
    <div style="padding: 20px; background: #f8fafc; border-bottom: 1px solid var(--border);">
        <h3 style="color:#2563eb;"><i class="fa-solid fa-bolt"></i> DISCOM Pro</h3>
    </div>
    <div class="sidebar-menu-list">
        <div class="menu-link-btn" onclick="exportDataToCSV()"><i class="fa-solid fa-file-csv" style="color:#ea580c;"></i> <span data-i18n="export_csv">Export CSV</span></div>
        <div class="menu-link-btn" onclick="openSettingsPage()"><i class="fa-solid fa-gear" style="color:#2563eb;"></i> <span data-i18n="settings_title">Settings</span></div>
    </div>
</div>

<div class="modal-overlay" id="formModalOverlay"><div class="modal-sheet" id="modalSheetContent"></div></div>

<script>
    /* =================================================================
       1. STATE & DATABASE (UPGRADED TO LOCALFORAGE/INDEXEDDB)
       ================================================================= */
    const DB_KEY = "DISCOM_ENTERPRISE_DB";
    
    // Default App State
    let appState = {
        settings: { language: 'hi', gpsInterval: 3, gpsDistance: 2 },
        currentFeederCode: "FDR-01",
        feeders: {
            "FDR-01": { feeder: { name: "11 kV Feeder-01", code: "FDR-01" }, gss: { name: "GSS", lat: 26.9150, lng: 75.7830 }, poles: [], dts: [], lines: [], consumers: [] }
        }
    };

    // History for Undo/Redo
    let historyStack = [];

    // Language Dictionary
    const dict = {
        en: {
            "line_11kv": "11 KV Line", "total_load": "Total Load", "transformers": "Transformers", "consumers": "Consumers",
            "search_placeholder": "Search Pole, K-No, Name...", "add_pole": "+ Pole", "add_line": "+ Line", "add_dt": "+ DT", "add_consumer": "+ Consumer",
            "settings_title": "Settings & Storage", "language": "Language", "gps_tracking_settings": "Smart GPS Tracking",
            "gps_interval": "Tracking Interval (Sec)", "gps_distance": "Distance Filter (m)", "gps_hint": "Updates location only after set time & distance to save battery.",
            "save_settings": "Save Settings", "export_csv": "Export CSV Data"
        },
        hi: {
            "line_11kv": "11 KV लाइन", "total_load": "कुल लोड", "transformers": "ट्रांसफार्मर", "consumers": "उपभोक्ता",
            "search_placeholder": "खोजें (Pole No, K-No, Name)...", "add_pole": "+ खंभा", "add_line": "+ लाइन", "add_dt": "+ DT", "add_consumer": "+ उपभोक्ता",
            "settings_title": "सेटिंग्स", "language": "भाषा (Language)", "gps_tracking_settings": "GPS स्मार्ट ट्रैकिंग",
            "gps_interval": "ट्रैकिंग टाइम (Seconds)", "gps_distance": "न्यूनतम दूरी (Meters)", "gps_hint": "बैटरी बचाने के लिए ट्रैकिंग केवल तय समय और दूरी के बाद अपडेट होगी।",
            "save_settings": "सेटिंग्स सेव करें", "export_csv": "CSV डाउनलोड करें"
        }
    };

    /* =================================================================
       2. CORE FUNCTIONS & AUTO-SYNC
       ================================================================= */
    function getActiveNetwork() {
        if (!appState.feeders[appState.currentFeederCode]) appState.currentFeederCode = Object.keys(appState.feeders)[0] || "FDR-01";
        return appState.feeders[appState.currentFeederCode];
    }

    function showToast(msg, isSync = false) {
        const toast = document.getElementById('app-toast');
        toast.innerText = msg;
        if(isSync) toast.classList.add('sync-toast'); else toast.classList.remove('sync-toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // DATABASE SAVE (LocalForage IndexedDB)
    async function triggerPersistence() {
        try {
            await localforage.setItem(DB_KEY, appState);
        } catch (err) {
            console.error("DB Save Error:", err);
            localStorage.setItem(DB_KEY, JSON.stringify(appState)); // Fallback
        }
    }

    // DATABASE LOAD
    async function loadPersistedData(callback) {
        try {
            const data = await localforage.getItem(DB_KEY);
            if (data && data.feeders) {
                appState = data;
            } else {
                const lsData = localStorage.getItem(DB_KEY);
                if(lsData) appState = JSON.parse(lsData);
            }
        } catch(e) { console.error("DB Load Error", e); }
        
        applyLanguage(appState.settings.language);
        if (callback) callback();
    }

    // SMART AUTO-SYNC (Network Listener)
    window.addEventListener('online', () => {
        showToast("🌐 Internet Back! Syncing...", true);
        // Simulate API Sync
        setTimeout(() => { showToast("✅ Data Synced with Server!", true); }, 2500);
    });

    /* =================================================================
       3. UNDO / REDO LOGIC
       ================================================================= */
    function saveSnapshot() {
        const net = getActiveNetwork();
        // Deep copy current state
        const snap = JSON.parse(JSON.stringify({ poles: net.poles, lines: net.lines, dts: net.dts, consumers: net.consumers }));
        historyStack.push(snap);
        if (historyStack.length > 15) historyStack.shift(); // Keep last 15 actions to save memory
    }

    function undoLastAction() {
        if (historyStack.length === 0) return showToast("No actions to Undo!");
        const prevState = historyStack.pop();
        const net = getActiveNetwork();
        net.poles = prevState.poles; net.lines = prevState.lines;
        net.dts = prevState.dts; net.consumers = prevState.consumers;
        
        renderEntireNetwork(); 
        triggerPersistence();
        showToast("Undo Successful ↺");
    }

    /* =================================================================
       4. LANGUAGE CHANGE LOGIC
       ================================================================= */
    function changeLanguage(lang) {
        appState.settings.language = lang;
        applyLanguage(lang);
        triggerPersistence();
    }

    function applyLanguage(lang) {
        if(!dict[lang]) lang = 'hi';
        const texts = dict[lang];
        
        // Update Inner Texts
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if(texts[key]) el.innerText = texts[key];
        });
        
        // Update Placeholders
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if(texts[key]) el.setAttribute('placeholder', texts[key]);
        });
        
        document.getElementById('setLanguage').value = lang;
    }

    /* =================================================================
       5. MAP & RENDER ENGINE
       ================================================================= */
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([26.9150, 75.7830], 16);
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 22 }).addTo(map);

    const featureGroups = { gss: L.layerGroup().addTo(map), lines: L.layerGroup().addTo(map), poles: L.layerGroup().addTo(map), dts: L.layerGroup().addTo(map), consumers: L.layerGroup().addTo(map) };

    function renderEntireNetwork() {
        Object.values(featureGroups).forEach(g => g.clearLayers());
        const net = getActiveNetwork();

        // Lines
        net.lines.forEach(l => {
            if(l.coords && l.coords.length > 1) {
                L.polyline(l.coords, { color: l.type.includes('33')?'#dc2626':(l.type.includes('11')?'#2563eb':'#16a34a'), weight: 3 }).addTo(featureGroups.lines);
            }
        });

        // Poles
        net.poles.forEach(p => {
            L.marker([p.lat, p.lng], { icon: L.divIcon({ className: 'pole-marker-icon', html: `<span>${p.poleNo.replace('P-','')}</span>`, iconSize:[22,22] }) })
             .bindPopup(`<b>Pole: ${p.poleNo}</b><br><button onclick="deleteEntity('pole','${p.id}')">Delete</button>`).addTo(featureGroups.poles);
        });

        // DTs & Consumers (Simplified for snippet length)
        net.consumers.forEach(c => {
            L.marker([c.lat, c.lng], { icon: L.divIcon({ className: 'consumer-marker-icon', html: `<i class="fa-solid fa-house"></i>`, iconSize:[18,18] }) })
             .addTo(featureGroups.consumers);
        });

        // Update Select & KPIs
        document.getElementById('feederSelectHeader').innerHTML = Object.keys(appState.feeders).map(k => `<option value="${k}" ${k===appState.currentFeederCode?'selected':''}>${appState.feeders[k].feeder.name}</option>`).join('');
        document.getElementById('kpiPoles') ? document.getElementById('kpiPoles').innerText = net.poles.length : null;
        document.getElementById('kpiConsumers').innerText = net.consumers.length;
        document.getElementById('kpiDT').innerText = net.dts.length;
    }

    /* =================================================================
       6. SEARCH FEATURE (FLY-TO)
       ================================================================= */
    function executeSearch() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        if(!q) return showToast("Enter ID to search");
        
        const net = getActiveNetwork();
        
        // Search in Poles
        let found = net.poles.find(p => p.poleNo.toLowerCase() === q);
        
        // Search in Consumers
        if(!found) found = net.consumers.find(c => c.kno.toLowerCase() === q || c.name.toLowerCase().includes(q));
        
        // Search in DTs
        if(!found) found = net.dts.find(d => d.code.toLowerCase() === q);

        if(found) {
            map.flyTo([found.lat, found.lng], 20, { animate: true, duration: 1.5 });
            showToast("🎯 Object Found!");
        } else {
            showToast("❌ Not Found in this Feeder");
        }
    }

    /* =================================================================
       7. ADD ENTITIES (Uses Snapshot for Undo)
       ================================================================= */
    function deleteEntity(type, id) {
        saveSnapshot(); // Save history before delete
        const net = getActiveNetwork();
        if(type==='pole') net.poles = net.poles.filter(x => x.id !== id);
        renderEntireNetwork(); triggerPersistence(); showToast("Deleted!");
    }

    // Modal UI logic...
    function toggleSpeedDial() { document.getElementById('speed-dial-menu').classList.toggle('active'); document.getElementById('mainFabBtn').classList.toggle('open'); }
    function toggleSidebar(open) { document.getElementById('sidebar-drawer').classList.toggle('open', open); document.getElementById('sidebarBackdrop').classList.toggle('open', open); }
    function openSettingsPage() { 
        document.getElementById('setGpsInterval').value = appState.settings.gpsInterval || 3;
        document.getElementById('setGpsDistance').value = appState.settings.gpsDistance || 2;
        document.getElementById('settings-page').classList.add('open'); 
        toggleSidebar(false);
    }
    function closeSettingsPage() { document.getElementById('settings-page').classList.remove('open'); }

    function openAddForm(type) {
        toggleSpeedDial();
        saveSnapshot(); // Save state before adding new
        const center = map.getCenter();
        const net = getActiveNetwork();
        
        if(type === 'POLE') {
            const no = `P-${net.poles.length + 1}`;
            net.poles.push({id: 'P_'+Date.now(), poleNo: no, lat: center.lat, lng: center.lng});
            renderEntireNetwork(); triggerPersistence(); showToast("Pole Added!");
        }
        // (Similar logic for Line, DT, Consumer forms can be expanded here)
    }

    /* =================================================================
       8. SMART GPS TRACKING (DISTANCE & TIME INTERVAL)
       ================================================================= */
    let liveTrackingId = null;
    let liveLocMarker = null;
    let lastGpsPos = null;

    function saveSettings() {
        appState.settings.gpsInterval = parseFloat(document.getElementById('setGpsInterval').value) || 3;
        appState.settings.gpsDistance = parseFloat(document.getElementById('setGpsDistance').value) || 2;
        triggerPersistence();
        closeSettingsPage();
        showToast("Settings Saved!");
    }

    // Calculate Distance between 2 coords in meters
    function calcMeters(lat1, lon1, lat2, lon2) {
        const R = 6371e3; const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function toggleLiveTracking() {
        const btn = document.getElementById('liveTrackBtn');
        if (liveTrackingId) {
            navigator.geolocation.clearWatch(liveTrackingId);
            liveTrackingId = null; lastGpsPos = null;
            if (liveLocMarker) map.removeLayer(liveLocMarker); liveLocMarker = null;
            btn.innerHTML = '<i class="fa-solid fa-crosshairs" style="color:#ef4444;"></i>';
            showToast("Tracking Stopped");
        } else {
            if (!navigator.geolocation) return alert("GPS not available");
            btn.innerHTML = '<i class="fa-solid fa-crosshairs" style="color:#10b981;"></i>';
            showToast("Smart Tracking Started...");
            
            const intervalMs = (appState.settings.gpsInterval || 3) * 1000;
            const distFilter = appState.settings.gpsDistance || 2;

            liveTrackingId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    const now = Date.now();

                    // Smart Filter: Check Distance & Time
                    if(lastGpsPos) {
                        const timeElapsed = now - lastGpsPos.time;
                        const distMoved = calcMeters(lastGpsPos.lat, lastGpsPos.lng, lat, lng);
                        
                        // Ignore update if time or distance is too small
                        if(timeElapsed < intervalMs && distMoved < distFilter) return;
                    }

                    lastGpsPos = { lat, lng, time: now };

                    if (!liveLocMarker) {
                        liveLocMarker = L.marker([lat, lng], { icon: L.divIcon({ className: '', html: `<div class="live-location-dot"><div class="live-location-pulse"></div></div>`, iconSize: [16,16] }) }).addTo(map);
                        map.flyTo([lat, lng], 19);
                    } else {
                        liveLocMarker.setLatLng([lat, lng]);
                    }
                },
                (err) => { alert("GPS Error: " + err.message); toggleLiveTracking(); },
                { enableHighAccuracy: true, maximumAge: intervalMs, timeout: 10000 }
            );
        }
    }

    /* Initialize */
    document.addEventListener('deviceready', () => loadPersistedData(renderEntireNetwork), false);
    window.addEventListener('DOMContentLoaded', () => { if (!window.cordova) loadPersistedData(renderEntireNetwork); });

</script>

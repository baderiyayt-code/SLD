<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e293b">
    <title>DISCOM Survey Pro</title>

    <script src="cordova.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tomickigrzegorz/leaflet-rotate@latest/dist/leaflet-rotate.js"></script>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        :root {
            --bg-base: #f8fafc; --bg-glass: rgba(255, 255, 255, 0.92); --bg-sheet: #ffffff;
            --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.3);
            --text-main: #0f172a; --text-sub: #64748b; --border: rgba(15, 23, 42, 0.1);
            --radius-lg: 16px; --radius-md: 10px;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.06); --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
            --c-11kv: #2563eb; --c-lt: #10b981; --c-dt: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-base); color: var(--text-main); }
        #app-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }

        /* ====== TOP HEADER & DASHBOARD ====== */
        #top-bar { position: absolute; top: env(safe-area-inset-top, 10px); left: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .header-glass { display: flex; justify-content: space-between; align-items: center; background: var(--bg-glass); backdrop-filter: blur(16px); padding: 10px 12px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); pointer-events: auto; }
        .header-title-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        
        .modern-select { appearance: none; background: #f1f5f9; color: var(--text-main); border: 1px solid transparent; padding: 8px 30px 8px 12px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 700; outline: none; cursor: pointer; max-width: 140px; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 8px center; background-size: 14px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;}
        
        .header-actions { display: flex; gap: 6px; }
        .action-btn-sm { width: 38px; height: 38px; border-radius: var(--radius-md); background: transparent; color: var(--accent); border: none; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; pointer-events: auto; }
        .action-btn-sm.bg { background: #f1f5f9; color: var(--text-main); font-size: 1rem; }

        .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; pointer-events: auto; }
        .kpi-tile { background: var(--bg-glass); backdrop-filter: blur(12px); padding: 8px 4px; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 3px solid transparent;}
        .kpi-tile:nth-child(1) { border-top-color: var(--c-11kv); } .kpi-tile:nth-child(2) { border-top-color: var(--c-dt); } .kpi-tile:nth-child(3) { border-top-color: var(--c-lt); } .kpi-tile:nth-child(4) { border-top-color: #8b5cf6; }
        .kpi-label { font-size: 0.6rem; color: var(--text-sub); font-weight: 700; }
        .kpi-val { font-size: 0.95rem; font-weight: 800; margin-top: 2px; }

        /* ====== MAP & CROSSHAIR ====== */
        #map { flex: 1; width: 100%; height: 100%; z-index: 1; background: #e2e8f0; }
        #center-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ef4444; font-size: 32px; font-weight: 900; pointer-events: none; z-index: 999; text-shadow: 0 0 6px #ffffff; }
        #reticle-coordinates { position: absolute; bottom: calc(105px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: #1e293b; color: #ffffff; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; box-shadow: var(--shadow-sm); pointer-events: none; z-index: 999; }

        /* ====== FLOATING TOOLS ====== */
        .right-tools-stack { position: absolute; right: 12px; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .round-tool-btn { width: 44px; height: 44px; background: var(--bg-sheet); color: var(--text-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border); cursor: pointer; }
        .undo-btn { background: #f59e0b; color: white; border-color: #f59e0b; }

        /* ====== SPEED DIAL ====== */
        #bottom-single-action { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 1002; }
        .center-plus-fab { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: white; border: 3px solid var(--bg-sheet); box-shadow: 0 8px 25px var(--accent-glow); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s; }
        .center-plus-fab.open { transform: rotate(45deg); background: #ef4444; box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3); }

        #speed-dial-menu { position: absolute; bottom: calc(95px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) scale(0.9); width: calc(100% - 24px); max-width: 380px; background: var(--bg-glass); backdrop-filter: blur(20px); border-radius: var(--radius-lg); padding: 14px; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 1001; }
        #speed-dial-menu.active { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }
        .dial-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .dial-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; box-shadow: var(--shadow-sm); }
        .dial-card i { font-size: 1.3rem; }
        .dial-card span { font-size: 0.65rem; font-weight: 700; color: var(--text-main); }

        /* ====== TOAST ====== */
        #app-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: #ffffff; padding: 12px 20px; border-radius: 12px; font-size: 0.9rem; font-weight: 600; box-shadow: var(--shadow-md); z-index: 5000; opacity: 0; transition: all 0.3s; display: flex; align-items: center; gap: 10px; }
        #app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ====== ICONS (HIGH SUNLIGHT VISIBILITY) ====== */
        .pole-marker-icon { background: #fde047; color: #0f172a; border: 2.5px solid #0f172a; border-radius: 50%; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); width: 26px; height: 26px; letter-spacing: -0.5px;}
        .pole-marker-icon.orphan-pulse { background: #ef4444 !important; color: white !important; border-color: white !important; animation: redGlow 1s infinite !important; }
        @keyframes redGlow { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        .dt-square-icon { background: #f59e0b; color: white; border: 1.5px solid white; border-radius: 6px; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; box-shadow: 0 3px 8px rgba(245, 158, 11, 0.4); }
        .consumer-marker-icon { background: #10b981; color: white; border: 1px solid white; border-radius: 50%; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 8px; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.4); }
        .gss-square-icon { background: #b91c1c; color: white; border: 2px solid white; border-radius: 8px; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; box-shadow: 0 4px 12px rgba(185, 28, 28, 0.4); }

        /* ====== MODALS ====== */
        .modal-overlay, #sidebarBackdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); z-index: 2000; display: none; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.2s;}
        .modal-overlay.open, #sidebarBackdrop.open { display: flex; opacity: 1; }
        .modal-sheet { width: 100%; max-width: 500px; background: var(--bg-sheet); border-radius: 24px 24px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s; }
        .modal-overlay.open .modal-sheet { transform: translateY(0); }
        .modal-sheet::before { content: ""; display: block; width: 40px; height: 4px; background: #cbd5e1; border-radius: 10px; margin: 0 auto 16px; }

        .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .sheet-title { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px;}
        .sheet-close-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; color: var(--text-sub); cursor: pointer; }

        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; }
        .form-input, .form-select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.95rem; font-weight: 600; background: #f8fafc; outline: none; }
        .form-input:focus, .form-select:focus { border-color: var(--accent); background: #ffffff; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn-action-primary { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-danger-outline { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.05); color: #ef4444; border: 1px solid #ef4444; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* ====== SETTINGS PAGE ====== */
        #settings-page { position: fixed; inset: 0; background: var(--bg-base); z-index: 4000; transform: translateX(100%); transition: transform 0.2s; display: flex; flex-direction: column; }
        #settings-page.open { transform: translateX(0); }
        .settings-header { background: #ffffff; padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .settings-body { flex: 1; overflow-y: auto; padding: 16px; }
        .settings-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }

        /* ====== SIDEBAR ====== */
        #sidebar-drawer { position: fixed; top: 0; left: 0; width: 80%; max-width: 300px; height: 100%; background: #ffffff; z-index: 3000; transform: translateX(-100%); transition: transform 0.2s; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
        #sidebar-drawer.open { transform: translateX(0); }
        
        .sidebar-header-gradient { padding: 24px 16px 16px; background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; }
        .user-profile-img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; object-fit: cover; margin-bottom: 10px; display: none; background: white;}
        
        .sidebar-menu-list { flex: 1; overflow-y: auto; padding: 16px; }
        .menu-category-title { font-size: 0.7rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin: 16px 0 8px 4px; }
        .menu-link-btn { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 600; cursor: pointer; background: transparent; color: var(--text-main);}
        .menu-link-btn:active { background: #f1f5f9; }
        .menu-link-btn i { font-size: 1.1rem; width: 20px; text-align: center; }

        #move-confirm-bar { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 12px; right: 12px; z-index: 2500; background: #ffffff; border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--border); box-shadow: var(--shadow-md); display: none; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="app-toast"><i class="fa-solid fa-circle-check" style="color:#4ade80;"></i> <span id="toast-msg">Success</span></div>

    <!-- TOP BAR -->
    <div id="top-bar">
        <div class="header-glass">
            <div class="header-title-group">
                <div class="action-btn-sm" onclick="toggleSidebar(true)"><i class="fa-solid fa-bars"></i></div>
                <select id="feederSelectHeader" class="modern-select" onchange="switchFeeder(this.value)"></select>
                <button class="action-btn-sm" onclick="openAddNewFeederModal()"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div class="header-actions">
                <button class="action-btn-sm bg" onclick="runOrphanNodeChecker()"><i class="fa-solid fa-network-wired" style="color:#d97706;"></i></button>
            </div>
        </div>
        <div class="kpi-row">
            <div class="kpi-tile"><div class="kpi-label" data-i18n="kpi_line">11 KV Line</div><div class="kpi-val" id="kpiLength">0 M</div></div>
            <div class="kpi-tile"><div class="kpi-label" data-i18n="kpi_dt">DT</div><div class="kpi-val" id="kpiDT">0</div></div>
            <div class="kpi-tile"><div class="kpi-label" data-i18n="kpi_load">Load</div><div class="kpi-val" id="kpiLoad">0 kVA</div></div>
            <div class="kpi-tile"><div class="kpi-label" data-i18n="kpi_cons">Cons.</div><div class="kpi-val" id="kpiConsumers">0</div></div>
        </div>
    </div>

    <!-- MAP CANVAS -->
    <div id="map"></div>

    <!-- CROSSHAIR -->
    <div id="center-crosshair"><i class="fa-solid fa-plus"></i></div>
    <div id="reticle-coordinates">0.000000, 0.000000</div>

    <div class="right-tools-stack">
        <button class="round-tool-btn" onclick="toggleMapLayer()"><i class="fa-solid fa-layer-group" style="color:#0ea5e9;"></i></button>
        <button class="round-tool-btn" id="liveTrackBtn" onclick="toggleLiveTracking()"><i class="fa-solid fa-crosshairs" style="color:#ef4444;"></i></button>
        <button class="round-tool-btn" onclick="openFilterModal()"><i class="fa-solid fa-filter" style="color:#d97706;"></i></button>
        <button class="round-tool-btn undo-btn" onclick="undoLastAction()"><i class="fa-solid fa-rotate-left"></i></button>
    </div>

    <div id="speed-dial-menu">
        <div class="dial-grid">
            <div class="dial-card" onclick="openAddForm('POLE')"><i class="fa-solid fa-grip-lines-vertical" style="color:#0ea5e9;"></i><span data-i18n="add_pole">Pole</span></div>
            <div class="dial-card" onclick="openAddForm('LINE')"><i class="fa-solid fa-arrow-trend-up" style="color:#2563eb;"></i><span data-i18n="add_line">Line</span></div>
            <div class="dial-card" onclick="openAddForm('DT')"><i class="fa-solid fa-bolt" style="color:#f59e0b;"></i><span data-i18n="add_dt">DT</span></div>
            <div class="dial-card" onclick="openAddForm('CONSUMER')"><i class="fa-solid fa-user-plus" style="color:#10b981;"></i><span data-i18n="add_cons">Consumer</span></div>
        </div>
    </div>

    <div id="bottom-single-action">
        <div class="center-plus-fab" id="mainFabBtn" onclick="toggleSpeedDial()"><i class="fa-solid fa-plus"></i></div>
    </div>

    <div id="move-confirm-bar">
        <div><b id="moveTargetTitle" style="color:var(--accent); font-size:1rem;" data-i18n="target">Target</b></div>
        <div class="move-actions-row">
            <button class="btn-confirm-move" onclick="confirmObjectMove()" data-i18n="btn_set">Set Here</button>
            <button class="btn-cancel-move" onclick="cancelObjectMove()" data-i18n="btn_cancel">Cancel</button>
        </div>
    </div>
</div>

<!-- SETTINGS PAGE (AUTO SAVE) -->
<div id="settings-page">
    <div class="settings-header">
        <button class="action-btn-sm" style="border:none; background:transparent; font-size:1.3rem;" onclick="closeSettingsPage()"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 style="font-size:1.1rem; font-weight:800;" data-i18n="settings">Settings</h2>
    </div>
    <div class="settings-body">
        
        <div class="settings-card">
            <div class="form-row" style="margin-bottom:0;">
                <label data-i18n="exp_path">Export Path</label>
                <select id="setExportPath" class="form-select" onchange="autoSaveSettings()">
                    <option value="DOWNLOADS" selected>📁 Downloads Folder</option>
                    <option value="APP_DOCUMENTS">🔒 App Storage</option>
                    <option value="BROWSER_SHARE">🌐 Direct Download</option>
                </select>
            </div>
        </div>

        <div class="settings-card">
            <div class="form-row" style="margin-bottom:0;">
                <label data-i18n="lang">Language</label>
                <select id="setLanguage" class="form-select" onchange="autoSaveSettings()">
                    <option value="hi">हिंदी (Hindi)</option>
                    <option value="en" selected>English</option>
                </select>
            </div>
        </div>

        <div class="settings-card">
            <h3 style="font-size:0.9rem; margin-bottom:12px;" data-i18n="gps_trk">Smart GPS</h3>
            <div class="form-grid-2">
                <div class="form-row" style="margin-bottom:0;"><label data-i18n="gps_int">Time (Sec)</label><input type="number" id="setGpsInterval" class="form-input" value="3" onchange="autoSaveSettings()" onkeyup="autoSaveSettings()"></div>
                <div class="form-row" style="margin-bottom:0;"><label data-i18n="gps_dist">Dist (m)</label><input type="number" id="setGpsDistance" class="form-input" value="2" onchange="autoSaveSettings()" onkeyup="autoSaveSettings()"></div>
            </div>
        </div>

        <div class="settings-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <b style="font-size:0.9rem;" data-i18n="orphan">Orphan Check</b>
                <label class="toggle-switch"><input type="checkbox" id="setOrphan" checked onchange="autoSaveSettings()"><span class="slider"></span></label>
            </div>
        </div>

        <div class="settings-card" style="border-color: #ef4444; background:#fef2f2;">
            <button type="button" class="btn-danger-outline" onclick="openResetConfirmationModal()"><i class="fa-solid fa-trash-can"></i> <span data-i18n="reset">Reset Data</span></button>
        </div>
    </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
<div id="sidebar-drawer">
    
    <div class="sidebar-header-gradient">
        <img id="sidebarProfileImg" class="user-profile-img" src="" alt="Profile">
        <h3 id="userNameDisplay" style="font-size:1rem; font-weight:700; display:none; margin-top:5px;"></h3>
        <p id="userEmailDisplay" style="font-size:0.75rem; opacity:0.9; margin-top:2px; display:none;"></p>
        
        <div id="googleAuthBox" style="margin-top: 10px;">
            <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
            <div class="g_id_signin" data-type="standard" data-theme="filled_blue" data-shape="rectangular" data-size="medium" data-width="100%"></div>
        </div>
        <button class="btn-action-primary" style="background:#10b981; display:none; padding:8px; font-size:0.85rem;" id="btnDriveBackup" onclick="backupToGoogleDrive()"><i class="fa-solid fa-cloud-arrow-up"></i> <span data-i18n="btn_drive">Backup to Drive</span></button>
    </div>

    <div class="sidebar-menu-list">
        <div class="menu-link-btn" onclick="openFeederConfigModal()" style="background:#eff6ff; color:#1d4ed8;">
            <i class="fa-solid fa-tower-broadcast"></i> <span data-i18n="fdr_cfg">Feeder Config</span>
        </div>

        <div class="menu-category-title" data-i18n="menu_exp">Export</div>
        <div class="menu-link-btn" onclick="generateCadSLDPdf()"><i class="fa-solid fa-file-pdf" style="color:#ef4444;"></i> <span data-i18n="exp_pdf">Export PDF</span></div>
        <div class="menu-link-btn" onclick="exportToAutoCAD_DXF()"><i class="fa-solid fa-draw-polygon" style="color:#10b981;"></i> <span data-i18n="exp_dxf">Export DXF</span></div>
        <div class="menu-link-btn" onclick="exportToGoogleEarth_KML()"><i class="fa-solid fa-earth-americas" style="color:#0ea5e9;"></i> <span data-i18n="exp_kml">Export KML</span></div>
        <div class="menu-link-btn" onclick="exportDataToCSV()"><i class="fa-solid fa-file-csv" style="color:#f59e0b;"></i> <span data-i18n="exp_csv">Export CSV</span></div>

        <div class="menu-category-title" data-i18n="menu_imp">Import</div>
        <label class="menu-link-btn">
            <i class="fa-solid fa-file-import" style="color:#8b5cf6;"></i><span data-i18n="imp_data">Import Data</span>
            <input type="file" id="csvFileInput" accept=".csv,text/csv,.json,application/json" style="display:none;" onchange="handleImportChoice(event)">
        </label>

        <div class="menu-category-title" data-i18n="menu_sys">System</div>

<!-- APP LOGIC -->

            "fdr_cfg": "फीडर सेटिंग्स", "exp_pdf": "PDF डाउनलोड", "exp_dxf": "DXF डाउनलोड", "exp_kml": "KML डाउनलोड", "exp_csv": "CSV डाउनलोड", "imp_data": "डेटा लोड करें",
            "btn_set": "यहाँ सेट करें", "btn_cancel": "रद्द करें",
            "loc": "लोकेशन", "pole": "पोल नंबर", "code": "कोड", "name": "नाम", "kno": "K-नंबर", "load": "लोड", "type": "प्रकार",
            "edit": "एडिट", "del": "डिलीट", "move": "मूव", "dist": "दूरी", "dir": "दिशा",
            "warn_connected": "चेतावनी: यह खंभा लाइनों से जुड़ा है! क्या आप डिलीट करना चाहते हैं?", "confirm_del": "क्या आप इसे डिलीट करना चाहते हैं?", "saved": "सेटिंग्स सुरक्षित!",
            "target": "स्थान बदलें", "btn_drive": "Drive पर सेव करें", "btn_reset": "सारा डेटा डिलीट करें",
            "menu_exp": "Export (डेटा फाइलें)", "menu_imp": "Import (डेटा लोड)", "menu_sys": "सिस्टम", "no_data": "कोई डेटा नहीं मिला", "same_node_err": "एक ही नोड को कनेक्ट नहीं कर सकते!"
        }
    };

    function t(key) { return dict[appState.settings.language || 'en'][key] || key; }

    function getActiveNetwork() {
        if (!appState.feeders[appState.currentFeederCode]) appState.currentFeederCode = Object.keys(appState.feeders)[0] || "FDR-01";
        let net = appState.feeders[appState.currentFeederCode];
        if (!net) { net = { feeder: { name: "11 kV Feeder-01", code: "FDR-01", subdivCode: "SD-01" }, gss: { name: "33/11 kV GSS", code: "GSS-01", lat: 26.9150, lng: 75.7830 }, poles: [], dts: [], lines: [], consumers: [] }; appState.feeders[appState.currentFeederCode] = net; }
        if (!Array.isArray(net.poles)) net.poles = []; if (!Array.isArray(net.lines)) net.lines = []; if (!Array.isArray(net.dts)) net.dts = []; if (!Array.isArray(net.consumers)) net.consumers = [];
        return net;
    }

    function showToast(msg, isSync = false) {
        const toast = document.getElementById('app-toast'); const msgElem = document.getElementById('toast-msg');
        if (!toast || !msgElem) return; msgElem.innerText = msg;
        if(isSync) toast.classList.add('sync-toast'); else toast.classList.remove('sync-toast');
        toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500);
    }

    async function triggerPersistence() { try { await localforage.setItem(DB_KEY, appState); } catch (err) { localStorage.setItem(DB_KEY, JSON.stringify(appState)); } }

    async function loadPersistedData(callback) {
        try { const data = await localforage.getItem(DB_KEY); if (data && data.feeders) appState = data; else { const lsData = localStorage.getItem(DB_KEY); if(lsData) appState = JSON.parse(lsData); } } catch(e) {}
        
        // Initial setup for settings
        document.getElementById('setLanguage').value = appState.settings.language || 'en';
        document.getElementById('setOrphan').checked = appState.settings.checkOrphanNode;
        document.getElementById('setExportPath').value = appState.settings.exportPath || 'DOWNLOADS';
        document.getElementById('setGpsInterval').value = appState.settings.gpsInterval || 3;
        document.getElementById('setGpsDistance').value = appState.settings.gpsDistance || 2;
        
        applyLanguage(appState.settings.language || 'en'); updateSidebarProfileUI();
        if (callback) callback();
    }

    function saveSnapshot() {
        const net = getActiveNetwork(); historyStack.push(JSON.parse(JSON.stringify({ poles: net.poles, lines: net.lines, dts: net.dts, consumers: net.consumers })));
        if (historyStack.length > 15) historyStack.shift();
    }

    function undoLastAction() {
        if (historyStack.length === 0) return showToast("No actions to Undo!");
        const prevState = historyStack.pop(); const net = getActiveNetwork();
        net.poles = prevState.poles; net.lines = prevState.lines; net.dts = prevState.dts; net.consumers = prevState.consumers;
        renderEntireNetwork(); triggerPersistence(); showToast("Undo Successful ↺");
    }

    // AUTO SAVE SETTINGS
    function autoSaveSettings() {
        const lang = document.getElementById('setLanguage').value;
        appState.settings.language = lang;
        appState.settings.checkOrphanNode = document.getElementById('setOrphan').checked;
        appState.settings.exportPath = document.getElementById('setExportPath').value;
        appState.settings.gpsInterval = parseFloat(document.getElementById('setGpsInterval').value) || 3;
        appState.settings.gpsDistance = parseFloat(document.getElementById('setGpsDistance').value) || 2;
        applyLanguage(lang); triggerPersistence(); renderEntireNetwork(); showToast(t('saved'));
    }

    function applyLanguage(lang) {
        if(!dict[lang]) lang = 'en'; const texts = dict[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if(texts[key]) el.innerText = texts[key]; });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const key = el.getAttribute('data-i18n-placeholder'); if(texts[key]) el.setAttribute('placeholder', texts[key]); });
        document.getElementById('moveTargetTitle').innerText = t('target') || "Target";
    }

    // MINI SEARCH FOR SELECT OPTIONS
    function searchSelectOptions(inputElem, selectId) {
        const query = inputElem.value.toLowerCase(); const select = document.getElementById(selectId); if(!select) return;
        if (!select.hasAttribute('data-original-html')) select.setAttribute('data-original-html', select.innerHTML);
        const tempDiv = document.createElement('div'); tempDiv.innerHTML = `<select>${select.getAttribute('data-original-html')}</select>`;
        const filtered = Array.from(tempDiv.firstChild.options).filter(opt => opt.text.toLowerCase().includes(query));
        select.innerHTML = ''; filtered.forEach(opt => select.appendChild(opt));
    }

    function toggleSpeedDial(force) {
        const dial = document.getElementById('speed-dial-menu'), fab = document.getElementById('mainFabBtn');
        if (!dial || !fab) return; const isOpen = force !== undefined ? force : !dial.classList.contains('active');
        dial.classList.toggle('active', isOpen); fab.classList.toggle('open', isOpen);
    }

    function toggleSidebar(open) { document.getElementById('sidebar-drawer').classList.toggle('open', open); document.getElementById('sidebarBackdrop').classList.toggle('open', open); }
    function openModal(html) { document.getElementById('modalSheetContent').innerHTML = html; document.getElementById('formModalOverlay').classList.add('open'); }
    function closeModal() { document.getElementById('formModalOverlay').classList.remove('open'); }

    function openSettingsPage() { toggleSidebar(false); document.getElementById('settings-page').classList.add('open'); }
    function closeSettingsPage() { document.getElementById('settings-page').classList.remove('open'); }

    function switchFeeder(code) {
        if (appState.feeders[code]) { appState.currentFeederCode = code; renderEntireNetwork(); triggerPersistence(); const net = getActiveNetwork(); if (net.gss && net.gss.lat) map.flyTo([net.gss.lat, net.gss.lng], 16); }
    }

    function getLineSpec(type) {
        const t = (type || '').toUpperCase();
        if (t.includes('33')) return { name: '33 KV', color: '#ef4444', weight: 4, dash: '8,8', filterKey: 'lines33' };
        if (t.includes('LT')) return { name: 'LT', color: '#10b981', weight: 2.5, dash: null, filterKey: 'linesLT' };
        return { name: '11 KV', color: '#2563eb', weight: 3.5, dash: null, filterKey: 'lines11' };
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
        const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function formatDistance(meters) { return `${meters.toFixed(1)} M`; }

    function getNodeCoords(nodeId) {
        const net = getActiveNetwork(); if (nodeId === 'GSS') return { lat: net.gss.lat, lng: net.gss.lng };
        const p = net.poles.find(x => x.poleNo == nodeId); return p ? { lat: p.lat, lng: p.lng } : null;
    }

    function computeParallelOffset(coords, offsetMeters) {
        if (!coords || coords.length < 2 || offsetMeters === 0) return coords;
        const lat1 = coords[0][0], lon1 = coords[0][1], lat2 = coords[1][0], lon2 = coords[1][1];
        const midLat = (lat1 + lat2) / 2; const cosLat = Math.cos(midLat * Math.PI / 180);
        const mPerDegLat = 111139, mPerDegLon = 111139 * cosLat;
        const dx = (lon2 - lon1) * mPerDegLon, dy = (lat2 - lat1) * mPerDegLat; const len = Math.sqrt(dx * dx + dy * dy);
        if (len === 0) return coords; const nx = -dy / len, ny = dx / len;
        return [[lat1 + (ny * offsetMeters) / mPerDegLat, lon1 + (nx * offsetMeters) / mPerDegLon], [lat2 + (ny * offsetMeters) / mPerDegLat, lon2 + (nx * offsetMeters) / mPerDegLon]];
    }

    function updateOrphanStatus() {
        appState.orphanPoleIds.clear(); if (!appState.settings.checkOrphanNode) return;
        const net = getActiveNetwork(); const adj = { 'GSS': [] };
        net.poles.forEach(p => adj[p.poleNo] = []);
        net.lines.forEach(l => { if (!adj[l.fromNode]) adj[l.fromNode] = []; if (!adj[l.toNode]) adj[l.toNode] = []; adj[l.fromNode].push(l.toNode); adj[l.toNode].push(l.fromNode); });
        const visited = new Set(['GSS']); const queue = ['GSS'];
        while (queue.length > 0) { const curr = queue.shift(); (adj[curr] || []).forEach(neighbor => { if (!visited.has(neighbor)) { visited.add(neighbor); queue.push(neighbor); } }); }
        net.poles.forEach(p => { if (!visited.has(p.poleNo)) appState.orphanPoleIds.add(p.id); });
    }

    const map = L.map('map', { zoomControl: false, attributionControl: false, preferCanvas: true, rotate: true }).setView([26.9150, 75.7830], 16);
    const tileLayers = { hybrid: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 22 }), streets: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 22 }) };
    let currentTileIndex = 0; const layerKeys = Object.keys(tileLayers); tileLayers[layerKeys[currentTileIndex]].addTo(map);

    function toggleMapLayer() { map.removeLayer(tileLayers[layerKeys[currentTileIndex]]); currentTileIndex = (currentTileIndex + 1) % layerKeys.length; tileLayers[layerKeys[currentTileIndex]].addTo(map); }

    const featureGroups = { gss: L.layerGroup().addTo(map), lines: L.layerGroup().addTo(map), poles: L.layerGroup().addTo(map), dts: L.layerGroup().addTo(map), consumers: L.layerGroup().addTo(map), consumerLines: L.layerGroup().addTo(map) };

    map.on('move', () => { const c = map.getCenter(); document.getElementById('reticle-coordinates').innerText = `${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`; });
    map.on('zoomend', () => renderEntireNetwork());

    function openFilterModal() {
        const f = appState.filters;
        openModal(`<div class="sheet-head"><div class="sheet-title"><i class="fa-solid fa-filter" style="color:#d97706;"></i> Object Filter</div><button class="sheet-close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>11 KV</b><label class="toggle-switch"><input type="checkbox" id="flt11" ${f.lines11?'checked':''}><span class="slider"></span></label></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>33 KV</b><label class="toggle-switch"><input type="checkbox" id="flt33" ${f.lines33?'checked':''}><span class="slider"></span></label></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>LT LINE</b><label class="toggle-switch"><input type="checkbox" id="fltLT" ${f.linesLT?'checked':''}><span class="slider"></span></label></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>${t('add_pole')}</b><label class="toggle-switch"><input type="checkbox" id="fltPoles" ${f.poles?'checked':''}><span class="slider"></span></label></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>${t('add_dt')}</b><label class="toggle-switch"><input type="checkbox" id="fltDTs" ${f.dts?'checked':''}><span class="slider"></span></label></div>
                <div style="display:flex; justify-content:space-between; align-items:center;"><b>${t('add_cons')}</b><label class="toggle-switch"><input type="checkbox" id="fltCons" ${f.consumers?'checked':''}><span class="slider"></span></label></div>
            </div><button class="btn-action-primary" onclick="saveFilters()"><i class="fa-solid fa-check"></i> Apply</button>`);
    }
    function saveFilters() {
        appState.filters.lines11 = document.getElementById('flt11').checked; appState.filters.lines33 = document.getElementById('flt33').checked; appState.filters.linesLT = document.getElementById('fltLT').checked;
        appState.filters.poles = document.getElementById('fltPoles').checked; appState.filters.dts = document.getElementById('fltDTs').checked; appState.filters.consumers = document.getElementById('fltCons').checked;
        closeModal(); renderEntireNetwork(); showToast("Filters Updated");
    }

    function renderEntireNetwork() {
        try {
            updateOrphanStatus(); Object.values(featureGroups).forEach(g => g.clearLayers());
            const net = getActiveNetwork(), f = appState.filters, currentZoom = map.getZoom();
            const showConsumers = currentZoom >= 20 && f.consumers, showDTs = currentZoom >= 18 && f.dts, showPoles = currentZoom >= 16 && f.poles, isGssMini = currentZoom < 14;

            if (net.gss && typeof net.gss.lat === 'number') {
                const gssIcon = isGssMini ? L.divIcon({ className: 'gss-mini-dot', iconSize: [16,16], iconAnchor: [8,8] }) : L.divIcon({ className: 'gss-square-icon', html: `<span>GSS</span>`, iconSize: [32,32], iconAnchor: [16,16] });
                const m = L.marker([net.gss.lat, net.gss.lng], { icon: gssIcon });
                m.bindPopup(`<div style="padding:4px;"><b style="color:#b91c1c; font-size:1.1rem;">GSS: ${net.gss.name}</b><br><button style="margin-top:8px; width:100%; padding:8px; background:#eff6ff; border:none; border-radius:6px; font-weight:700;" onclick="openFeederConfigModal()">${t('settings')}</button></div>`);
                featureGroups.gss.addLayer(m);
            }

            const spanBuckets = {};
            net.lines.forEach(line => {
                if (!line.coords || line.coords.length < 2) { const c1 = getNodeCoords(line.fromNode); const c2 = getNodeCoords(line.toNode); if (c1 && c2) { line.coords = [[c1.lat, c1.lng], [c2.lat, c2.lng]]; line.distanceMeters = calcDistance(c1.lat, c1.lng, c2.lat, c2.lng); } else return; }
                const spec = getLineSpec(line.type); if (!f[spec.filterKey]) return;
                const spanKey = [line.fromNode, line.toNode].sort().join('<-->'); if (!spanBuckets[spanKey]) spanBuckets[spanKey] = []; spanBuckets[spanKey].push(line);
            });

            Object.keys(spanBuckets).forEach(spanKey => {
                const linesInSpan = spanBuckets[spanKey]; const totalInSpan = linesInSpan.length;
                linesInSpan.forEach((line, idx) => {
                    const spec = getLineSpec(line.type); let offsetMeters = (totalInSpan > 1) ? (idx - (totalInSpan - 1) / 2) * 3.2 : 0;
                    const shiftedCoords = computeParallelOffset(line.coords, offsetMeters);
                    
                    const hitPoly = L.polyline(shiftedCoords, { color: 'transparent', weight: 25 }).addTo(featureGroups.lines);
                    L.polyline(shiftedCoords, { color: spec.color, weight: spec.weight, dashArray: spec.dash, lineCap: 'round', interactive: false }).addTo(featureGroups.lines);
                    
                    hitPoly.bindPopup(`<div style="padding:4px;"><b style="color:${spec.color};">${spec.name}</b><p style="margin:4px 0;">${t('dir')}: <b>${line.fromNode} ➔ ${line.toNode}</b></p><p style="margin:4px 0;">${t('dist')}: <b>${formatDistance(line.distanceMeters||0)}</b></p><button style="width:100%; padding:8px; background:#fee2e2; color:#dc2626; border:none; border-radius:6px; font-weight:700;" onclick="deleteEntity('line','${line.id}')">${t('del')}</button></div>`);
                });
            });

            if (f.poles) {
                net.poles.forEach(p => {
                    const isOrphan = appState.orphanPoleIds.has(p.id); if (!showPoles && !isOrphan) return;
                    const m = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: 'pole-marker-icon' + (isOrphan ? ' orphan-pulse' : ''), html: `<span>${p.poleNo}</span>`, iconSize: [26,26], iconAnchor: [13,13] }) });
                    m.bindPopup(`<div style="padding:4px;"><b>${t('pole')}: ${p.poleNo}</b><div style="display:flex; gap:6px; margin-top:8px;"><button style="flex:1; padding:8px; background:#eff6ff; border:none; border-radius:6px;" onclick="openEditModal('pole','${p.id}')">${t('edit')}</button><button style="flex:1; padding:8px; background:#fef3c7; border:none; border-radius:6px;" onclick="startObjectMove('POLE','${p.id}','${p.poleNo}')">${t('move')}</button><button style="flex:1; padding:8px; background:#fee2e2; color:#dc2626; border:none; border-radius:6px;" onclick="deleteEntity('pole','${p.id}')">${t('del')}</button></div></div>`);
                    featureGroups.poles.addLayer(m);
                });
            }

            if (f.dts && showDTs) {
                net.dts.forEach(d => {
                    if (!d.lat || !d.lng) { const p = net.poles.find(x => x.poleNo == d.poleNo); if (p) { d.lat = p.lat; d.lng = p.lng; } }
                    if (!d.lat || !d.lng) return;
                    const m = L.marker([d.lat, d.lng], { icon: L.divIcon({ className: 'dt-square-icon', html: `${d.rating}`, iconSize: [22,22], iconAnchor: [11,11] }) });
                    m.bindPopup(`<div style="padding:4px;"><b style="color:#d97706;">DT: ${d.code}</b><p style="margin:4px 0;">${t('type')}: <b>${d.phase||''}</b> | ${d.rating} kVA<br>${t('loc')}: ${d.location||'-'}</p><div style="display:flex; gap:6px; margin-top:8px;"><button style="flex:1; padding:8px; background:#eff6ff; border:none; border-radius:6px;" onclick="openEditModal('dt','${d.id}')">${t('edit')}</button><button style="flex:1; padding:8px; background:#fef3c7; border:none; border-radius:6px;" onclick="startObjectMove('DT','${d.id}','${d.code}')">${t('move')}</button><button style="flex:1; padding:8px; background:#fee2e2; color:#dc2626; border:none; border-radius:6px;" onclick="deleteEntity('dt','${d.id}')">${t('del')}</button></div></div>`);
                    featureGroups.dts.addLayer(m);
                });
            }

            if (showConsumers) {
                const poleConsumerCounts = {}; 
                net.consumers.forEach(c => {
                    const pole = net.poles.find(p => p.poleNo == c.poleNo);
                    if (!c.lat || !c.lng) { if (pole) { poleConsumerCounts[c.poleNo] = (poleConsumerCounts[c.poleNo] || 0); const count = poleConsumerCounts[c.poleNo]++; const radius = 0.00015 + (Math.floor(count / 6) * 0.0001); const angle = count * (Math.PI / 3); c.lat = pole.lat + (radius * Math.sin(angle)); c.lng = pole.lng + (radius * Math.cos(angle)); } }
                    if (!c.lat || !c.lng) return;
                    if (pole && f.poles && currentZoom >= 16) { L.polyline([[pole.lat, pole.lng], [c.lat, c.lng]], { color: '#000000', weight: 1, dashArray: '2,4' }).addTo(featureGroups.consumerLines); }
                    const m = L.marker([c.lat, c.lng], { icon: L.divIcon({ className: 'consumer-marker-icon', html: `<i class="fa-solid fa-house"></i>`, iconSize: [16,16], iconAnchor: [8,8] }) });

    function deleteEntity(type, id) {
        const net = getActiveNetwork();
        if (type === 'pole') {
            const p = net.poles.find(x => x.id === id);
            const connected = net.lines.some(l => l.fromNode == p.poleNo || l.toNode == p.poleNo);
            if(connected) { if(!confirm(t('warn_connected'))) return; }
            else { if(!confirm(t('confirm_del'))) return; }
            saveSnapshot();
            net.poles = net.poles.filter(x => x.id !== id);
            net.lines = net.lines.filter(l => l.fromNode != p.poleNo && l.toNode != p.poleNo);
            net.dts = net.dts.filter(d => d.poleNo != p.poleNo);
            net.consumers = net.consumers.filter(c => c.poleNo != p.poleNo);
        } else {
            if(!confirm(t('confirm_del'))) return;
            saveSnapshot();
            if (type === 'line') net.lines = net.lines.filter(x => x.id !== id);
            else if (type === 'dt') net.dts = net.dts.filter(x => x.id !== id);
            else if (type === 'consumer') net.consumers = net.consumers.filter(x => x.id !== id);
        }
        renderEntireNetwork(); triggerPersistence(); showToast("Deleted!");
    }

    let liveTrackingId = null; let liveLocMarker = null; let lastGpsPos = null;
    function toggleLiveTracking() {
        const btn = document.getElementById('liveTrackBtn');
        if (liveTrackingId) { navigator.geolocation.clearWatch(liveTrackingId); liveTrackingId = null; lastGpsPos = null; if (liveLocMarker) map.removeLayer(liveLocMarker); liveLocMarker = null; btn.innerHTML = '<i class="fa-solid fa-crosshairs" style="color:#ef4444;"></i>'; } 
        else {
            if (!navigator.geolocation) return; btn.innerHTML = '<i class="fa-solid fa-crosshairs" style="color:#10b981;"></i>';
            const intervalMs = (appState.settings.gpsInterval || 3) * 1000, distFilter = appState.settings.gpsDistance || 2;
            liveTrackingId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude, now = Date.now();
                    if(lastGpsPos) { if(now - lastGpsPos.time < intervalMs && calcDistance(lastGpsPos.lat, lastGpsPos.lng, lat, lng) < distFilter) return; }
                    lastGpsPos = { lat, lng, time: now };
                    if (!liveLocMarker) { liveLocMarker = L.marker([lat, lng], { icon: L.divIcon({ className: '', html: `<div class="live-location-dot"><div class="live-location-pulse"></div></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map); map.flyTo([lat, lng], 19); } 
                    else liveLocMarker.setLatLng([lat, lng]);
                }, (err) => { toggleLiveTracking(); }, { enableHighAccuracy: true, maximumAge: intervalMs, timeout: 12000 }
            );
        }
    }

    function downloadOrSaveExportFile(filename, dataBlobOrText, mimeType) {
        const pathChoice = appState.settings.exportPath || 'DOWNLOADS'; const isCordova = Boolean(window.cordova && cordova.file);
        if (isCordova && pathChoice !== 'BROWSER_SHARE') {
            let targetDir = cordova.file.dataDirectory; if (pathChoice === 'DOWNLOADS' && cordova.file.externalRootDirectory) targetDir = cordova.file.externalRootDirectory + 'Download/';
            window.resolveLocalFileSystemURL(targetDir, function (dirEntry) { dirEntry.getFile(filename, { create: true, exclusive: false }, function (fileEntry) { fileEntry.createWriter(function (fw) { fw.onwriteend = function () { if (fw.length === 0) { fw.onwriteend = function() { showToast("Saved: " + filename); }; fw.write(dataBlobOrText instanceof Blob ? dataBlobOrText : new Blob([dataBlobOrText], { type: mimeType })); } }; fw.truncate(0); }); }, function () { fallbackWebDownload(filename, dataBlobOrText, mimeType); }); }, function () { fallbackWebDownload(filename, dataBlobOrText, mimeType); });
        } else fallbackWebDownload(filename, dataBlobOrText, mimeType);
    }
    function fallbackWebDownload(filename, dataBlobOrText, mimeType) { const blob = dataBlobOrText instanceof Blob ? dataBlobOrText : new Blob([dataBlobOrText], { type: mimeType }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500); }

    function getCSVString() {
        const net = getActiveNetwork(); let csv = "\uFEFF[POLES]\nPoleNo,Latitude,Longitude\n"; net.poles.forEach(p => { csv += `"${p.poleNo}",${p.lat},${p.lng}\n`; });
        csv += "\n[LINES]\nLineType,FromNode,ToNode,DistanceMeters\n"; net.lines.forEach(l => { csv += `"${l.type}","${l.fromNode}","${l.toNode}",${(l.distanceMeters || 0).toFixed(1)}\n`; });
        csv += "\n[TRANSFORMERS]\nDTCode,PoleNo,RatingKVA,Location,Latitude,Longitude\n"; net.dts.forEach(d => { csv += `"${d.code}","${d.poleNo}","${d.rating}","${d.location||''}",${d.lat},${d.lng}\n`; });
        csv += "\n[CONSUMERS]\nName,KNumber,ConnectedPole,Load,Latitude,Longitude\n"; net.consumers.forEach(c => { csv += `"${c.name}","${c.kno}","${c.poleNo}","${c.load}",${c.lat},${c.lng}\n`; }); return csv;
    }

    function exportDataToCSV() { toggleSidebar(false); downloadOrSaveExportFile(`${getActiveNetwork().feeder.name.replace(/\s+/g, '_')}_Data.csv`, getCSVString(), "text/csv;charset=utf-8;"); }
    function exportToAutoCAD_DXF() { toggleSidebar(false); let dxf = "0\nSECTION\n2\nENTITIES\n"; getActiveNetwork().lines.forEach(l => { if (l.coords && l.coords[0] && l.coords[1]) dxf += `0\nLINE\n8\n${l.type.replace(/\s+/g,'_')}\n10\n${l.coords[0][1]}\n20\n${l.coords[0][0]}\n30\n0\n11\n${l.coords[1][1]}\n21\n${l.coords[1][0]}\n31\n0\n`; }); dxf += "0\nENDSEC\n0\nEOF\n"; downloadOrSaveExportFile(`${getActiveNetwork().feeder.name.replace(/\s+/g, '_')}.dxf`, dxf, "application/dxf"); }
    function exportToGoogleEarth_KML() { toggleSidebar(false); let kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${getActiveNetwork().feeder.name}</name>`; getActiveNetwork().lines.forEach(l => { if (l.coords && l.coords[0] && l.coords[1]) kml += `<Placemark><name>${l.type}</name><LineString><coordinates>${l.coords[0][1]},${l.coords[0][0]},0 ${l.coords[1][1]},${l.coords[1][0]},0</coordinates></LineString></Placemark>`; }); kml += "</Document></kml>"; downloadOrSaveExportFile(`${getActiveNetwork().feeder.name.replace(/\s+/g, '_')}.kml`, kml, "application/vnd.google-earth.kml+xml"); }
    
    // Auto Adjust Chart Paper PDF Export
    function generateCadSLDPdf() { 
        toggleSidebar(false); const net = getActiveNetwork();
        const pts = [];
        if (net.gss && net.gss.lat) pts.push({ lat: net.gss.lat, lng: net.gss.lng });
        net.poles.forEach(p => pts.push({ lat: p.lat, lng: p.lng }));
        net.dts.forEach(d => pts.push({ lat: d.lat, lng: d.lng }));
        net.consumers.forEach(c => pts.push({ lat: c.lat, lng: c.lng }));
        
        if (pts.length === 0) return alert(t('no_data'));

        let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
        pts.forEach(p => { if(p.lat < minLat) minLat = p.lat; if(p.lat > maxLat) maxLat = p.lat; if(p.lng < minLng) minLng = p.lng; if(p.lng > maxLng) maxLng = p.lng; });

        let dLat = maxLat - minLat; if (dLat === 0) dLat = 0.001; let dLng = maxLng - minLng; if (dLng === 0) dLng = 0.001;

        const canvas = document.getElementById('cad-canvas'); const ctx = canvas.getContext('2d');
        const W = 3508, H = 2480; // A3 Landscape
        canvas.width = W; canvas.height = H;
        
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 10; ctx.strokeRect(40, 40, W - 80, H - 80);

        ctx.fillStyle = "#0f172a"; ctx.font = "bold 50px Arial"; ctx.fillText(`SLD: ${net.feeder.name.toUpperCase()}`, 80, 120);
        ctx.font = "30px Arial"; ctx.fillStyle = "#64748b"; ctx.fillText(`GSS: ${net.gss.name} (${net.gss.code}) | Subdiv: ${net.feeder.subdivCode}`, 80, 170);

        const padX = 200, padY = 250, usableW = W - (padX * 2), usableH = H - (padY * 2);
        const scale = Math.min(usableW / dLng, usableH / dLat);
        const xOff = padX + (usableW - (dLng * scale)) / 2, yOff = padY + (usableH - (dLat * scale)) / 2;

        const toX = (lng) => xOff + ((lng - minLng) * scale);
        const toY = (lat) => H - (yOff + ((lat - minLat) * scale));

        net.lines.forEach(l => {
            if(!l.coords || l.coords.length < 2) return; const spec = getLineSpec(l.type);
            ctx.lineWidth = spec.weight * 2; ctx.strokeStyle = spec.color;
            ctx.beginPath(); ctx.moveTo(toX(l.coords[0][1]), toY(l.coords[0][0])); ctx.lineTo(toX(l.coords[1][1]), toY(l.coords[1][0])); ctx.stroke();
        });

        net.poles.forEach(p => {
            const dx = toX(p.lng), dy = toY(p.lat);
            ctx.beginPath(); ctx.arc(dx, dy, 8, 0, 2 * Math.PI); ctx.fillStyle = "#fde047"; ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = "#0f172a"; ctx.stroke();
            ctx.fillStyle = "#0f172a"; ctx.font = "bold 14px Arial"; ctx.fillText(p.poleNo, dx + 12, dy + 5);
        });

        net.dts.forEach(d => {
            const dx = toX(d.lng), dy = toY(d.lat); ctx.fillStyle = "#f59e0b"; ctx.fillRect(dx - 12, dy - 12, 24, 24);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(d.rating, dx, dy);
        });

        if (net.gss && net.gss.lat) {
            const gx = toX(net.gss.lng), gy = toY(net.gss.lat); ctx.fillStyle = "#b91c1c"; ctx.fillRect(gx - 20, gy - 20, 40, 40);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("GSS", gx, gy);
        }

        const { jsPDF } = window.jspdf; const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
        pdf.addImage(canvas.toDataURL('image/png', 1.0), 'PNG', 0, 0, 420, 297);
        downloadOrSaveExportFile(`${net.feeder.name.replace(/\s+/g, '_')}_CAD_SLD.pdf`, pdf.output('blob'), "application/pdf");
    }

    function handleImportChoice(e) { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ev => { try { const p = JSON.parse(ev.target.result); if(p.feeders) appState = p; else if(p.poles) { const n = getActiveNetwork(); n.poles = p.poles||[]; n.lines = p.lines||[]; n.dts = p.dts||[]; n.consumers = p.consumers||[]; } renderEntireNetwork(); triggerPersistence(); showToast("Imported!"); } catch(err) { alert("Invalid File"); } }; r.readAsText(f); e.target.value = ''; }

    /* ====== DECODE JWT GOOGLE TOKEN ====== */
    function parseJwt(token) { try { return JSON.parse(decodeURIComponent(window.atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } catch(e) { return null; } }
    function handleCredentialResponse(response) {
        if(response.credential) {
            const user = parseJwt(response.credential);
            if(user) {
                appState.user = { isLoggedIn: true, name: user.name, email: user.email, photoUrl: user.picture };
                updateSidebarProfileUI(); triggerPersistence(); document.getElementById('btnDriveBackup').style.display = 'block'; showToast("Google Login Success!");
            }
        }
    }
    function updateSidebarProfileUI() {
        if(appState.user.isLoggedIn && appState.user.name) {
            document.getElementById('userNameDisplay').innerText = appState.user.name; document.getElementById('userNameDisplay').style.display = 'block';
            document.getElementById('userEmailDisplay').innerText = appState.user.email; document.getElementById('userEmailDisplay').style.display = 'block';
            document.getElementById('googleAuthBox').style.display = 'none'; document.getElementById('btnDriveBackup').style.display = 'flex';
            if(appState.user.photoUrl) { const img = document.getElementById('sidebarProfileImg'); img.src = appState.user.photoUrl; img.style.display = 'block'; document.getElementById('sidebarProfileIcon').style.display = 'none'; }
        }
    }
    function backupToGoogleDrive() { showToast("Uploading to Drive..."); setTimeout(() => { showToast("Backup Successful!", true); }, 2000); }

    function initializeApplication() { loadPersistedData(() => { renderEntireNetwork(); document.getElementById('reticle-coordinates').innerText = `${map.getCenter().lat.toFixed(6)}, ${map.getCenter().lng.toFixed(6)}`; }); }
    document.addEventListener('deviceready', initializeApplication, false); window.addEventListener('DOMContentLoaded', () => { if (!window.cordova) initializeApplication(); });
</script>
